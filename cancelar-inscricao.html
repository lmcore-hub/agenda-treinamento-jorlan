<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cancelar inscrição | Agenda de Treinamento</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg:#ebe7e2;--card:#fff;--ink:#0b0b0c;--muted:#676b74;--line:#d8d4ce;--danger:#aa2e24;--success:#236946;--radius:34px;--shadow:0 14px 40px rgba(0,0,0,.07)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{text-decoration:none;color:inherit}.topbar{height:86px;background:#fff;border-bottom:1px solid #e8e3dd;display:flex;align-items:center}.topbar-inner{width:min(1180px,calc(100% - 34px));margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:18px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#60646c}.brand img{width:170px}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;border-radius:16px;padding:12px 18px;font-weight:900}.main{min-height:calc(100vh - 86px);display:grid;place-items:center;padding:34px 18px}.card{width:min(100%,760px);background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:42px}.eyebrow{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:8px 14px;color:var(--muted);font-size:13px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;margin-bottom:20px}h1{font-size:clamp(42px,5vw,68px);line-height:.94;letter-spacing:-.06em;margin:0 0 18px;font-weight:950}p{color:var(--muted);font-size:18px;line-height:1.5;margin:0 0 24px}.details{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.detail{background:#f6f3ef;border-radius:18px;padding:16px}.detail span{display:block;color:var(--muted);font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}.detail strong{font-size:18px}.submit{width:100%;border:0;border-radius:20px;background:#09090a;color:#fff;padding:18px 22px;font-size:18px;font-weight:950;cursor:pointer}.submit:disabled{opacity:.55;cursor:not-allowed}.alert{display:none;margin:18px 0;border-radius:18px;padding:16px 18px;font-weight:800;line-height:1.45}.alert.show{display:block}.alert.success{background:#e8f5ef;color:var(--success)}.alert.error{background:#f8e8e6;color:var(--danger)}@media(max-width:640px){.card{padding:28px}.details{grid-template-columns:1fr}.topbar{height:auto}.topbar-inner{padding:16px 0;align-items:flex-start;flex-direction:column}.brand img{width:150px}h1{font-size:44px}}
  </style>
</head>
<body>
  <header class="topbar"><div class="topbar-inner"><a class="brand" href="index.html"><img src="assets/logo-jorlan.png" alt="Grupo Jorlan" /><span>Agenda de Treinamento</span></a><a class="btn" href="index.html">Voltar</a></div></header>
  <main class="main">
    <section class="card">
      <div class="eyebrow">Cancelamento de inscrição</div>
      <h1>Cancelar inscrição</h1>
      <p>Confira os dados abaixo. O cancelamento pelo site só é permitido até 24 horas antes do treinamento.</p>
      <div id="bookingDetails" class="details"></div>
      <div id="cancelAlert" class="alert"></div>
      <button id="cancelButton" class="submit" type="button">Confirmar cancelamento</button>
    </section>
  </main>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/cancelar-inscricao.js"></script>
</body>
</html>
