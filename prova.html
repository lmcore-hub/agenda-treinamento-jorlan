<!doctype html>
<html lang='pt-BR'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Avaliação Técnica de Seminovos</title>
<script src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'></script>
<script src='https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js'></script>
<style>
:root{--bg:#ebe7e2;--card:#fff;--ink:#121314;--muted:#6e727a;--line:#d9d4cc;--soft:#f6f3ef;--shadow:0 10px 32px rgba(0,0,0,.06);--radius:26px;--danger:#b33a2d;--success:#256947;--premium:#7c5c14;--black:#0a0a0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input,select{font:inherit}.topbar{background:#fff;border-bottom:1px solid #e7e2db;position:sticky;top:0;z-index:20}.topbar-inner{max-width:1200px;margin:auto;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:18px;text-decoration:none;color:inherit}.brand img{width:178px}.brand-title{padding-left:18px;border-left:2px solid #ddd7cf;font-size:18px;font-weight:850;letter-spacing:.08em;color:#666a72;text-transform:uppercase}.wrap{max-width:1180px;margin:auto;padding:24px 22px 34px}.hero{margin-bottom:18px}.hero h1{margin:0 0 6px;font-size:48px;line-height:.96;letter-spacing:-.055em;font-weight:950}.hero p{margin:0;color:var(--muted);font-size:17px}.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-bottom:18px}.btn,button{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:16px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:14px;font-weight:850;cursor:pointer;text-decoration:none}.dark,.primary{background:var(--black)!important;color:#fff!important;border-color:var(--black)!important}.danger{background:#fff7f6!important;color:var(--danger)!important;border-color:#ebcdc8!important}.muted{color:var(--muted)}.bad{color:var(--danger);font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:11px}.field label{font-size:13px;font-weight:850;color:#565960}.field input,.field select,input,select{border:1px solid var(--line);border-radius:14px;padding:11px 13px;background:#fff;min-height:44px;width:100%}.notice{padding:14px 16px;border-radius:16px;background:#fff8dd;border:1px solid #eadfa8;color:var(--premium);font-weight:800;margin:14px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.message,.preview{background:var(--soft);border:1px solid #eee8df;border-radius:16px;padding:14px;white-space:pre-wrap;font-size:14px}.timer{position:sticky;top:82px;background:var(--black);color:#fff;padding:12px 16px;border-radius:16px;font-weight:900;text-align:center;z-index:3;margin-bottom:14px}.q{padding:18px 0;border-bottom:1px solid #eee8df}.choice{display:block;border:1px solid #d8d4ce;border-radius:16px;padding:12px;margin:8px 0;cursor:pointer;background:#fff}.choice:has(input:checked){border-color:#0a0a0b;background:#f6f3ef}table{width:100%;border-collapse:collapse;min-width:860px;background:#fff}th{text-align:left;padding:14px 12px;background:#f7f4f0;color:#565960;font-size:12px;text-transform:uppercase;letter-spacing:.05em}td{padding:14px 12px;border-top:1px solid #efebe5;vertical-align:top;font-size:14px}.tablewrap{overflow:auto;border:1px solid #ece7e0;border-radius:20px;max-height:560px}.qrgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.qrbox{border:1px solid #eee8df;border-radius:20px;padding:16px;background:#fff}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.kpi{border:1px solid #eee8df;border-radius:16px;padding:16px;background:var(--soft)}.kpi b{display:block;font-size:28px;margin-top:6px}@media(max-width:760px){.topbar-inner{flex-direction:column;align-items:flex-start}.wrap{padding:18px 14px 24px}.hero h1{font-size:38px}.grid,.filters,.qrgrid,.kpis{grid-template-columns:1fr}.brand img{width:160px}.brand-title{font-size:14px;padding-left:12px}.timer{top:0}}
</style>
</head>
<body>
<header class='topbar'><div class='topbar-inner'><a class='brand' href='painel-administrador.html'><img src='assets/logo-jorlan.png' alt='Grupo Jorlan'><div class='brand-title'>Controle de provas</div></a><a class='btn' href='painel-administrador.html'>Painel</a></div></header>
<main class='wrap'><section class='hero'><h1>Avaliação técnica</h1><p>Provas individuais, QR Code, WhatsApp e dashboard de resultados.</p></section><div id='app'></div></main>
<script>
const API_BASE='https://knpcfkexhqpihpfrvpzg.supabase.co/functions/v1/training-exam';const app=document.getElementById('app'),qs=new URLSearchParams(location.search),token=qs.get('token');let adminToken=localStorage.getItem('exam_admin_token'),dashboardRows=[];const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>'`]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','`':'&#96;'}[m]))}async function api(name,opt={}){const r=await fetch(API_BASE+'?api='+name,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||j.message||'Erro');return j}async function adminApi(name,opt={}){return api(name,{...opt,headers:{...(opt.headers||{}),'x-admin-token':adminToken}})}function link(t){return location.origin+location.pathname+'?token='+encodeURIComponent(t)}function copy(t){navigator.clipboard.writeText(t).then(()=>alert('Copiado.'))}function statusPt(s){return({not_started:'Não iniciada',in_progress:'Em andamento',submitted:'Concluída',expired:'Tempo encerrado'})[s]||s}function zap(n,l){return `Olá, ${n}! Tudo bem?\n\nSegue sua avaliação do treinamento de Seminovos.\n\nA prova possui 10 questões e o tempo começa somente quando você clicar em “Iniciar prova”.\n\nSeu acesso é individual:\n${l}\n\nFaça a prova pelo celular e, após finalizar, sua participação ficará registrada automaticamente.\n\nBoa prova!`}
function norm(v){return String(v??'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim()}function clean(v){if(v===null||v===undefined||v instanceof Date)return'';return String(v).replace(/\s+/g,' ').trim()}function invalidName(v){const r=clean(v),n=norm(r);if(!r||r.length<3)return true;if(['data','hora','horario','nome','nome completo','participante','aluno','colaborador','vendedor','consultor','cargo','loja','cidade','praca','email','e mail','telefone','celular','n','no','numero','tema','treinamento','tema treinamento','nota minima'].includes(n))return true;if(/^\d+([\.,]\d+)?$/.test(r))return true;if(/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(r)||/^\d{4}-\d{2}-\d{2}$/.test(r))return true;if(/^[\d\s\-\/\.]+$/.test(r))return true;if(!/[A-Za-zÀ-ÿ]/.test(r))return true;if(r.split(' ').filter(Boolean).length<2)return true;return false}function extract(rows){const a=['nome','nome completo','participante','aluno','colaborador','vendedor','consultor'];let hr=-1,nc=-1,det='';for(let r=0;r<Math.min(rows.length,12);r++){const row=rows[r]||[];for(let c=0;c<row.length;c++){if(a.includes(norm(row[c]))){hr=r;nc=c;det=clean(row[c]);break}}if(nc>=0)break}if(nc<0)return{names:[],detected:'',rejected:['Nenhuma coluna de nome encontrada.']};const names=[],seen=new Set(),rejected=[];for(let r=hr+1;r<rows.length;r++){const v=clean((rows[r]||[])[nc]);if(!v)continue;if(invalidName(v)){rejected.push(v);continue}const k=norm(v);if(!seen.has(k)){seen.add(k);names.push(v)}}return{names,detected:det||('Coluna '+(nc+1)),rejected:rejected.slice(0,15)}}
async function candidate(){try{const i=await api('candidate_info&token='+encodeURIComponent(token));if(['submitted','expired'].includes(i.status)){app.innerHTML=`<div class='card'><h2>Prova encerrada</h2><p>${esc(i.name)}, sua avaliação já foi registrada.</p><p class='muted'>O resultado será acompanhado pelo responsável pelo treinamento.</p></div>`;return}app.innerHTML=`<div class='card'><h2>${esc(i.training_exam_batches.title)}</h2><p><b>Aluno:</b> ${esc(i.name)}</p><p><b>Tempo:</b> ${esc(i.training_exam_batches.duration_minutes)} minutos • <b>10 questões</b></p><p class='muted'>O cronômetro começa ao clicar em Iniciar.</p><button class='primary' id='start'>Iniciar prova</button></div>`;$('start').onclick=startExam}catch(e){app.innerHTML=`<div class='card bad'>${esc(e.message)}</div>`}}
async function startExam(){try{const d=await api('candidate_start',{method:'POST',body:JSON.stringify({token})});let h=`<div class='timer' id='timer'></div><div class='card'><h2>Prova de ${esc(d.student.name)}</h2><p class='muted'>Marque uma alternativa em cada questão.</p>`;for(const q of d.questions){h+=`<div class='q'><b>${q.position}. ${esc(q.stem)}</b>`;for(const c of q.choices)h+=`<label class='choice'><input type='radio' name='q${q.id}' value='${c.label}' ${q.selected===c.label?'checked':''}> <b>${c.label})</b> ${esc(c.text)}</label>`;h+='</div>'}h+=`<div style='margin-top:18px'><button class='primary' id='submit'>Finalizar prova</button></div></div>`;app.innerHTML=h;document.querySelectorAll('input[type=radio]').forEach(el=>el.onchange=async e=>{try{await api('candidate_answer',{method:'POST',body:JSON.stringify({token,question_id:Number(e.target.name.slice(1)),selected:e.target.value})})}catch(err){alert(err.message)}});$('submit').onclick=async()=>{if(!confirm('Finalizar a prova?'))return;try{await api('candidate_submit',{method:'POST',body:JSON.stringify({token})});candidate()}catch(e){alert(e.message)}};const exp=new Date(d.student.expires_at).getTime();const tick=()=>{const left=Math.max(0,exp-Date.now()),m=Math.floor(left/60000),s=Math.floor((left%60000)/1000),t=$('timer');if(t)t.textContent='Tempo restante: '+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(left<=0){clearInterval(iv);api('candidate_submit',{method:'POST',body:JSON.stringify({token})}).finally(candidate)}};tick();const iv=setInterval(tick,1000)}catch(e){alert(e.message);candidate()}}
async function admin(){if(!adminToken){app.innerHTML=`<div class='card' style='max-width:480px;margin:auto'><h2>Painel do responsável</h2><div class='field'><label>Usuário</label><input id='user'></div><div class='field'><label>Senha</label><input id='pass' type='password'></div><button class='primary' id='login'>Entrar</button></div>`;$('login').onclick=async()=>{try{const d=await api('login',{method:'POST',body:JSON.stringify({username:$('user').value,password:$('pass').value})});adminToken=d.token;localStorage.setItem('exam_admin_token',adminToken);adminHome()}catch(e){alert(e.message)}};return}adminHome()}
async function adminHome(){try{await adminApi('admin_batches');app.innerHTML=`<div class='card'><div style='display:flex;justify-content:space-between;gap:10px;align-items:center'><div><h2>Nova prova</h2><p class='muted'>Importe até 8 participantes e gere QR Code, link individual e WhatsApp.</p></div><button id='logout'>Sair</button></div><div class='grid'><div class='field'><label>Título</label><input id='title' value='Avaliação pós-treinamento — Seminovos'></div><div class='field'><label>Data</label><input id='date' type='date' value='${new Date().toISOString().slice(0,10)}'></div><div class='field'><label>Tempo (min)</label><input id='duration' type='number' value='15' min='5' max='60'></div><div class='field'><label>Planilha Excel</label><input id='excel' type='file' accept='.xlsx,.xls,.csv'></div></div><div class='notice'>Importação segura: a planilha precisa ter coluna Nome, Participante, Aluno, Colaborador, Vendedor ou Consultor. Datas, números e cabeçalhos são bloqueados.</div><button class='primary' id='create'>Gerar provas</button></div><div id='out'></div><div class='card'><h2>Dashboard e histórico</h2><div class='filters'><div class='field'><label>Loja</label><select id='fStore'><option value=''>Todas</option></select></div><div class='field'><label>Gestor</label><select id='fManager'><option value=''>Todos</option></select></div><div class='field'><label>Status</label><select id='fStatus'><option value=''>Todos</option><option value='not_started'>Não iniciada</option><option value='in_progress'>Em andamento</option><option value='submitted'>Concluída</option><option value='expired'>Tempo encerrado</option></select></div><div class='field'><label>Data</label><input id='fDate' type='date'></div><div class='field'><label>Participante</label><input id='fName'></div><div class='field'><label>Nota mínima</label><input id='fScore' type='number' min='0' max='10' step='.1'></div></div><div class='actions'><button class='primary' id='applyFilters'>Aplicar filtros</button><button id='clearFilters'>Limpar</button><button id='exportDash'>Exportar CSV</button></div></div><div id='dashboard'></div>`;$('logout').onclick=()=>{localStorage.removeItem('exam_admin_token');adminToken=null;admin()};$('create').onclick=createBatch;$('applyFilters').onclick=renderDashboard;$('clearFilters').onclick=()=>{['fStore','fManager','fStatus','fDate','fName','fScore'].forEach(id=>$(id).value='');renderDashboard()};$('exportDash').onclick=exportDashboard;await loadDashboard()}catch(e){localStorage.removeItem('exam_admin_token');adminToken=null;admin()}}
async function createBatch(){const f=$('excel').files[0];if(!f){alert('Selecione o Excel.');return}const data=await f.arrayBuffer(),wb=XLSX.read(data,{cellDates:true}),ws=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''});const ex=extract(rows);let names=ex.names;if(!names.length){alert('Nenhum nome válido encontrado.');return}if(names.length>8){names=names.slice(0,8);alert('Serão usados somente os 8 primeiros nomes.')}const prev='Coluna detectada: '+(ex.detected||'-')+'\n\nNomes que serão gerados:\n- '+names.join('\n- ')+(ex.rejected.length?'\n\nItens ignorados:\n- '+ex.rejected.join('\n- '):'');$('out').innerHTML=`<div class='card'><h2>Conferência antes de gerar</h2><div class='preview'>${esc(prev)}</div><p class='muted'>Se algum nome estiver errado, cancele e corrija a planilha.</p></div>`;if(!confirm('Confirmar geração para estes participantes?\n\n'+names.join('\n')))return;try{const d=await adminApi('admin_create_batch',{method:'POST',body:JSON.stringify({title:$('title').value,training_date:$('date').value,duration_minutes:Number($('duration').value),store:'Automático conforme inscrição',manager:'Automático conforme cargo e loja',students:names})});let h=`<div class='card'><h2>Acessos gerados</h2><div class='qrgrid'>`;for(const s of d.students){const l=link(s.access_token),m=zap(s.name,l);h+=`<div class='qrbox'><h3>${esc(s.name)}</h3><div id='qr${s.id}' style='margin:12px 0'></div><div class='message'>${esc(m)}</div><div class='actions' style='margin-top:10px'><button class='copyMsg' data-msg='${encodeURIComponent(m)}'>Copiar mensagem</button><button class='copyLink' data-link='${encodeURIComponent(l)}'>Copiar link</button></div></div>`}h+='</div></div>';$('out').innerHTML=h;for(const s of d.students)new QRCode($('qr'+s.id),{text:link(s.access_token),width:150,height:150});document.querySelectorAll('.copyMsg').forEach(b=>b.onclick=()=>copy(decodeURIComponent(b.dataset.msg)));document.querySelectorAll('.copyLink').forEach(b=>b.onclick=()=>copy(decodeURIComponent(b.dataset.link)));await loadDashboard()}catch(e){alert(e.message)}}
async function loadDashboard(){dashboardRows=await adminApi('admin_dashboard');const stores=[...new Set(dashboardRows.map(r=>r.training_exam_batches?.store).filter(Boolean))].sort(),managers=[...new Set(dashboardRows.map(r=>r.training_exam_batches?.manager).filter(Boolean))].sort();$('fStore').innerHTML='<option value="">Todas</option>'+stores.map(x=>`<option>${esc(x)}</option>`).join('');$('fManager').innerHTML='<option value="">Todos</option>'+managers.map(x=>`<option>${esc(x)}</option>`).join('');renderDashboard()}
function filteredRows(){return dashboardRows.filter(r=>{const b=r.training_exam_batches||{};return(!$('fStore').value||b.store===$('fStore').value)&&(!$('fManager').value||b.manager===$('fManager').value)&&(!$('fStatus').value||r.status===$('fStatus').value)&&(!$('fDate').value||b.training_date===$('fDate').value)&&(!$('fName').value||r.name.toLowerCase().includes($('fName').value.toLowerCase()))&&(!$('fScore').value||(Number(r.score)||0)>=Number($('fScore').value))})}function renderDashboard(){const rows=filteredRows(),done=rows.filter(r=>['submitted','expired'].includes(r.status)),avg=done.length?(done.reduce((s,r)=>s+(Number(r.score)||0),0)/done.length).toFixed(1):'-',a7=done.filter(r=>(Number(r.score)||0)>=7).length;let h=`<div class='card'><div class='kpis'><div class='kpi'>Participantes<b>${rows.length}</b></div><div class='kpi'>Concluídas<b>${done.length}</b></div><div class='kpi'>Nota média<b>${avg}</b></div><div class='kpi'>Nota ≥ 7<b>${a7}</b></div></div></div><div class='card'><h2>Histórico de participantes</h2><div class='tablewrap'><table><thead><tr><th>Data</th><th>Loja</th><th>Gestor</th><th>Participante</th><th>Status</th><th>Acertos</th><th>Nota</th><th>Acesso</th></tr></thead><tbody>`;for(const r of rows){const b=r.training_exam_batches||{},l=link(r.access_token),m=zap(r.name,l);h+=`<tr><td>${esc(b.training_date||'-')}</td><td>${esc(b.store||'-')}</td><td>${esc(b.manager||'-')}</td><td>${esc(r.name)}</td><td>${esc(statusPt(r.status))}</td><td>${r.correct_count??'-'}/10</td><td><b>${r.score??'-'}</b></td><td><button class='histAccess' data-name='${encodeURIComponent(r.name)}' data-link='${encodeURIComponent(l)}' data-msg='${encodeURIComponent(m)}'>Ver acesso</button></td></tr>`}h+='</tbody></table></div></div>';$('dashboard').innerHTML=h;document.querySelectorAll('.histAccess').forEach(b=>b.onclick=()=>{const n=decodeURIComponent(b.dataset.name),l=decodeURIComponent(b.dataset.link),m=decodeURIComponent(b.dataset.msg);$('out').innerHTML=`<div class='card'><h2>${esc(n)}</h2><div id='historyQr' style='margin:12px 0'></div><div class='message'>${esc(m)}</div><div class='actions' style='margin-top:10px'><button id='copyHistoryMsg'>Copiar mensagem</button><button id='copyHistoryLink'>Copiar link</button></div></div>`;new QRCode($('historyQr'),{text:l,width:180,height:180});$('copyHistoryMsg').onclick=()=>copy(m);$('copyHistoryLink').onclick=()=>copy(l);window.scrollTo({top:0,behavior:'smooth'})})}function exportDashboard(){const rows=filteredRows(),data=[['Data','Loja','Gestor','Participante','Status','Acertos','Nota','Link'],...rows.map(r=>{const b=r.training_exam_batches||{};return[b.training_date||'',b.store||'',b.manager||'',r.name,statusPt(r.status),r.correct_count??'',r.score??'',link(r.access_token)]})];const blob=new Blob([data.map(x=>x.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='dashboard_provas.csv';a.click()}
if(token)candidate();else admin();
</script>
</body>
</html>
