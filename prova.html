<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Controle de Provas | Agenda de Treinamento</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#ebe7e2;--card:#fff;--ink:#121314;--muted:#6e727a;--line:#d9d4cc;--soft:#f6f3ef;--shadow:0 10px 32px rgba(0,0,0,.06);--radius:24px;--danger:#b33a2d;--success:#256947;--premium:#7c5c14;--black:#0a0a0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{text-decoration:none;color:inherit}button,input,select{font:inherit}.topbar{background:#fff;border-bottom:1px solid #e7e2db;position:sticky;top:0;z-index:20}.topbar-inner{max-width:1240px;margin:auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:16px}.brand img{width:168px}.brand-title{padding-left:16px;border-left:2px solid #ddd7cf;font-size:15px;font-weight:900;letter-spacing:.08em;color:#666a72;text-transform:uppercase}.wrap{max-width:1240px;margin:auto;padding:20px}.hero{margin-bottom:14px}.hero h1{margin:0 0 5px;font-size:42px;line-height:.96;letter-spacing:-.055em;font-weight:950}.hero p{margin:0;color:var(--muted);font-size:15px}.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}.btn,button{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 12px;border-radius:13px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:12px;font-weight:900;cursor:pointer;white-space:nowrap}.primary{background:var(--black)!important;color:#fff!important;border-color:var(--black)!important}.danger{background:#fff7f6!important;color:var(--danger)!important;border-color:#ebcdc8!important}.success{background:#f0fbf4!important;color:var(--success)!important;border-color:#cae7d7!important}.muted{color:var(--muted)}.bad{color:var(--danger);font-weight:800}.actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:10px;font-weight:950;color:#565960;text-transform:uppercase;letter-spacing:.05em}.field input,.field select,input:not([type=radio]),select{border:1px solid var(--line);border-radius:13px;padding:8px 10px;background:#fff;min-height:38px;width:100%;font-size:12px}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:end;flex-wrap:wrap}.feedback{display:none;margin-bottom:12px;border-radius:14px;padding:11px 13px;font-size:13px;font-weight:850}.feedback.show{display:block}.feedback.success{background:#e7f5ee;color:var(--success)}.feedback.error{background:#f8e8e6;color:var(--danger)}.tablewrap{overflow:auto;border:1px solid #ece7e0;border-radius:18px;background:#fff;max-height:660px}table{width:100%;border-collapse:collapse;min-width:980px;background:#fff}th{text-align:left;padding:10px 9px;background:#f7f4f0;color:#565960;font-size:10px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}td{padding:10px 9px;border-top:1px solid #efebe5;vertical-align:middle;font-size:12px}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;background:var(--soft);border:1px solid #eee8df;font-size:11px;font-weight:900;color:#565960}.badge.ok{background:#e7f5ee;color:var(--success)}.badge.bad{background:#f8e8e6;color:var(--danger)}.badge.wait{background:#fff8dd;color:var(--premium)}.screen-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.notice{padding:11px 13px;border-radius:16px;background:#fff8dd;border:1px solid #eadfa8;color:var(--premium);font-weight:850;margin:10px 0;font-size:13px}.qrgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.qrbox{border:1px solid #eee8df;border-radius:18px;padding:14px;background:#fff}.message,.preview{background:var(--soft);border:1px solid #eee8df;border-radius:16px;padding:13px;white-space:pre-wrap;font-size:13px}.timer{position:sticky;top:78px;background:var(--black);color:#fff;padding:12px 16px;border-radius:16px;font-weight:900;text-align:center;z-index:3;margin-bottom:14px}.q{padding:18px 0;border-bottom:1px solid #eee8df}.q-title{display:block;margin-bottom:12px;font-size:16px;line-height:1.35}.choice{display:flex;align-items:center;gap:12px;width:100%;border:1px solid #d8d4ce;border-radius:16px;padding:14px 16px;margin:9px 0;cursor:pointer;background:#fff;line-height:1.35}.choice:hover{border-color:#aaa39a;background:#fbfaf8}.choice input[type=radio]{appearance:none;-webkit-appearance:none;width:22px;height:22px;min-width:22px;min-height:22px;flex:0 0 22px;margin:0;padding:0;border:2px solid #9a9a9a;border-radius:999px;background:#fff}.choice input[type=radio]:checked{border-color:var(--black);background:var(--black);box-shadow:inset 0 0 0 5px #fff}.choice:has(input:checked){border-color:var(--black);background:var(--soft);box-shadow:0 0 0 1px var(--black) inset}.choice-text{display:block}.choice-text b{font-weight:950}@media(max-width:760px){.topbar-inner{flex-direction:column;align-items:flex-start}.wrap{padding:16px 12px}.hero h1{font-size:34px}.qrgrid{grid-template-columns:1fr}table{min-width:820px}.brand img{width:150px}.brand-title{font-size:13px;padding-left:12px}.timer{top:0}}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-inner"><a class="brand" href="painel-administrador.html"><img src="assets/logo-jorlan.png" alt="Grupo Jorlan"><div class="brand-title">Controle de provas</div></a><a class="btn" href="painel-administrador.html">Painel</a></div></header>
<main class="wrap"><section class="hero"><h1>Avaliação técnica</h1><p>Gere provas por turma, somente para presença confirmada, com envio por WhatsApp.</p></section><div id="app"></div></main>
<script>
const API_BASE='https://knpcfkexhqpihpfrvpzg.supabase.co/functions/v1/training-exam';
const app=document.getElementById('app');const params=new URLSearchParams(location.search);const token=params.get('token');let adminToken=localStorage.getItem('exam_admin_token');let batches=[],examSlots=[],slotBookings=[],selectedSlot=null;
const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function api(name,opt={}){const r=await fetch(API_BASE+'?api='+name,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||j.message||'Erro');return j}async function adminApi(name,opt={}){return api(name,{...opt,headers:{...(opt.headers||{}),'x-admin-token':adminToken}})}
function fmtDateBR(date){const [y,m,d]=String(date||'').slice(0,10).split('-');return d&&m&&y?`${d}/${m}/${y}`:String(date||'')}function candidateLink(t){return location.origin+location.pathname+'?token='+encodeURIComponent(t)}function digitsOnly(v){return String(v||'').replace(/\D/g,'')}function brPhone(v){let d=digitsOnly(v);if(!d)return'';if(d.startsWith('55')&&d.length>=12)return d;if(d.length>=10&&d.length<=11)return'55'+d;return d}function ptStatus(s){return({not_started:'Não iniciada',in_progress:'Em andamento',submitted:'Concluída',expired:'Tempo encerrado'})[s]||s}function presenceStatus(s){return({pending:'Pendente',confirmed:'Confirmou',present:'Presente',absent:'Faltou'})[s]||'Pendente'}function badgeCls(s){return ['confirmed','present','submitted'].includes(String(s))?'ok':String(s)==='absent'?'bad':'wait'}function examMsg(name,link){return `Olá, ${name}! Tudo bem?\n\nSegue sua avaliação do treinamento de Seminovos.\n\nA prova possui 10 questões e o tempo começa somente quando você clicar em “Iniciar prova”.\n\nSeu acesso é individual:\n${link}\n\nFaça a prova pelo celular e, após finalizar, sua participação ficará registrada automaticamente.\n\nBoa prova!`}function openWhatsApp(s){const phone=brPhone(s.phone);const link=s.link||candidateLink(s.access_token);if(!phone){alert('Telefone não localizado para este participante.');return}window.open(`https://wa.me/${phone}?text=${encodeURIComponent(examMsg(s.name,link))}`,'_blank','noopener')}function copyText(t){navigator.clipboard.writeText(t).then(()=>alert('Copiado.'))}function feedback(type,msg){const box=$('feedback');if(!box){alert(msg);return}box.className='feedback show '+(type==='success'?'success':'error');box.textContent=msg;box.scrollIntoView({behavior:'smooth',block:'nearest'})}
async function candidate(){try{const i=await api('candidate_info&token='+encodeURIComponent(token));if(['submitted','expired'].includes(i.status)){app.innerHTML=`<div class='card'><h2>Prova encerrada</h2><p>${esc(i.name)}, sua avaliação já foi registrada.</p><p class='muted'>O resultado será acompanhado pelo responsável pelo treinamento.</p></div>`;return}app.innerHTML=`<div class='card'><h2>${esc(i.training_exam_batches.title)}</h2><p><b>Aluno:</b> ${esc(i.name)}</p><p><b>Tempo:</b> ${esc(i.training_exam_batches.duration_minutes)} minutos • <b>10 questões</b></p><p class='muted'>O cronômetro começa ao clicar em Iniciar.</p><button class='primary' id='start'>Iniciar prova</button></div>`;$('start').onclick=startExam}catch(e){app.innerHTML=`<div class='card bad'>${esc(e.message)}</div>`}}
async function startExam(){try{const d=await api('candidate_start',{method:'POST',body:JSON.stringify({token})});let h=`<div class='timer' id='timer'></div><div class='card'><h2>Prova de ${esc(d.student.name)}</h2><p class='muted'>Marque uma alternativa em cada questão.</p>`;for(const q of d.questions){h+=`<div class='q'><b class='q-title'>${q.position}. ${esc(q.stem)}</b>`;for(const c of q.choices)h+=`<label class='choice'><input type='radio' name='q${q.id}' value='${c.label}' ${q.selected===c.label?'checked':''}><span class='choice-text'><b>${c.label})</b> ${esc(c.text)}</span></label>`;h+='</div>'}h+=`<div style='margin-top:18px'><button class='primary' id='submit'>Finalizar prova</button></div></div>`;app.innerHTML=h;document.querySelectorAll('input[type=radio]').forEach(el=>el.onchange=async e=>{try{await api('candidate_answer',{method:'POST',body:JSON.stringify({token,question_id:Number(e.target.name.slice(1)),selected:e.target.value})})}catch(err){alert(err.message)}});$('submit').onclick=async()=>{if(!confirm('Finalizar a prova?'))return;try{await api('candidate_submit',{method:'POST',body:JSON.stringify({token})});candidate()}catch(e){alert(e.message)}};const exp=new Date(d.student.expires_at).getTime();const tick=()=>{const left=Math.max(0,exp-Date.now()),m=Math.floor(left/60000),s=Math.floor((left%60000)/1000),t=$('timer');if(t)t.textContent='Tempo restante: '+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(left<=0){clearInterval(iv);api('candidate_submit',{method:'POST',body:JSON.stringify({token})}).finally(candidate)}};tick();const iv=setInterval(tick,1000)}catch(e){alert(e.message);candidate()}}
async function admin(){if(!adminToken){app.innerHTML=`<div class='card' style='max-width:480px;margin:auto'><h2>Painel do responsável</h2><div class='field'><label>Usuário</label><input id='user'></div><div class='field'><label>Senha</label><input id='pass' type='password'></div><button class='primary' id='login'>Entrar</button></div>`;$('login').onclick=async()=>{try{const d=await api('login',{method:'POST',body:JSON.stringify({username:$('user').value,password:$('pass').value})});adminToken=d.token;localStorage.setItem('exam_admin_token',adminToken);await loadHome()}catch(e){alert(e.message)}};return}await loadHome()}
async function loadHome(){[batches,examSlots]=await Promise.all([adminApi('admin_batches'),adminApi('admin_exam_slots')]);renderHome()}
function renderHome(){selectedSlot=null;slotBookings=[];app.innerHTML=`<div id='feedback' class='feedback'></div><div class='card'><div class='toolbar'><div><h2 style='margin:0'>Provas</h2><p class='muted' style='margin:5px 0 0'>Fluxo oficial: escolha uma turma, marque presença se necessário e gere prova só para confirmados/presentes.</p></div><div class='actions'><button class='primary' id='newExam'>+ Nova prova</button><button id='reload'>Atualizar</button><button id='logout'>Sair</button></div></div></div><div id='work'></div>${renderBatches()}`;$('newExam').onclick=()=>renderSlotList();$('reload').onclick=loadHome;$('logout').onclick=()=>{localStorage.removeItem('exam_admin_token');adminToken=null;admin()};document.querySelectorAll('[data-results]').forEach(b=>b.onclick=()=>showResults(b.dataset.results));document.querySelectorAll('[data-send-batch]').forEach(b=>b.onclick=()=>sendBatch(b.dataset.sendBatch));document.querySelectorAll('[data-delete-batch]').forEach(b=>b.onclick=()=>deleteBatch(b.dataset.deleteBatch,b.dataset.title||''))}
function renderSlotList(){document.getElementById('work').innerHTML=`<div class='card'><div class='screen-head'><div><h2 style='margin:0'>Nova prova</h2><p class='muted' style='margin:5px 0 0'>Turmas realizadas/com inscritos. A prova será gerada apenas para confirmados/presentes.</p></div><button id='backHome'>Voltar</button></div><div class='tablewrap'><table><thead><tr><th>Data</th><th>Horário</th><th>Inscritos</th><th>Confirmados</th><th>Pendentes</th><th>Lojas</th><th>Ação</th></tr></thead><tbody>${examSlots.map(s=>`<tr><td><b>${esc(fmtDateBR(s.slot_date))}</b></td><td>${esc(s.slot_time)}</td><td>${s.total}</td><td><span class='badge ok'>${s.confirmed_count}</span></td><td><span class='badge wait'>${s.pending_count}</span></td><td>${esc(s.stores||'-')}</td><td><button class='primary' data-open-slot='${esc(s.slot_date)}|${esc(s.slot_time)}'>Abrir turma</button></td></tr>`).join('')||`<tr><td colspan='7'>Nenhuma turma com inscritos.</td></tr>`}</tbody></table></div></div>`;$('backHome').onclick=()=>{document.getElementById('work').innerHTML=''};document.querySelectorAll('[data-open-slot]').forEach(b=>b.onclick=()=>openSlot(b.dataset.openSlot))}
async function openSlot(value){const [date,time]=value.split('|');selectedSlot={date,time};slotBookings=await adminApi('admin_slot_bookings&training_date='+encodeURIComponent(date)+'&slot_time='+encodeURIComponent(time));renderSlot()}
function renderSlot(){const confirmed=slotBookings.filter(b=>['confirmed','present'].includes(String(b.attendance_status))).length;document.getElementById('work').innerHTML=`<div class='card'><div class='screen-head'><div><h2 style='margin:0'>${fmtDateBR(selectedSlot.date)} • ${selectedSlot.time}</h2><p class='muted' style='margin:5px 0 0'>${slotBookings.length} inscritos • ${confirmed} confirmados/presentes.</p></div><div class='actions'><button id='backSlots'>Voltar para turmas</button><button class='primary' id='createExam'>Gerar prova dos confirmados</button></div></div><div class='notice'>Se alguém participou e não confirmou no site, marque manualmente como “Presente” antes de gerar a prova.</div><div class='tablewrap'><table><thead><tr><th>Participante</th><th>Contato</th><th>Loja</th><th>Presença</th><th>Ação</th></tr></thead><tbody>${slotBookings.map(b=>`<tr><td><b>${esc(b.name)}</b><br><span class='muted'>${esc(b.role||'-')}</span></td><td>${esc(b.phone||'-')}<br><span class='muted'>${esc(b.email||'')}</span></td><td>${esc(b.store||'-')}<br><span class='muted'>${esc(b.city||'')}</span></td><td><span class='badge ${badgeCls(b.attendance_status)}'>${presenceStatus(b.attendance_status)}</span></td><td><div class='actions'><button class='success' data-pres='${esc(b.id)}' data-status='present'>Presente</button><button class='danger' data-pres='${esc(b.id)}' data-status='absent'>Faltou</button><button data-pres='${esc(b.id)}' data-status='pending'>Pendente</button></div></td></tr>`).join('')}</tbody></table></div></div>`;$('backSlots').onclick=()=>renderSlotList();$('createExam').onclick=createFromSlot;document.querySelectorAll('[data-pres]').forEach(btn=>btn.onclick=()=>markPresence(btn.dataset.pres,btn.dataset.status))}
async function markPresence(id,status){await adminApi('admin_mark_attendance',{method:'POST',body:JSON.stringify({booking_id:id,status})});await openSlot(selectedSlot.date+'|'+selectedSlot.time)}
async function createFromSlot(){if(!selectedSlot)return;const confirmed=slotBookings.filter(b=>['confirmed','present'].includes(String(b.attendance_status))).length;if(!confirmed)return feedback('error','Nenhum participante confirmado/presente nesta turma.');if(!confirm('Gerar prova somente para confirmados/presentes?'))return;const d=await adminApi('admin_create_present_batch',{method:'POST',body:JSON.stringify({title:'Avaliação pós-treinamento — Seminovos',training_date:selectedSlot.date,slot_time:selectedSlot.time,duration_minutes:15})});feedback('success',`Prova criada para ${d.students.length} participante(s).`);renderAccess(d.students,'Voltar para turma');await loadHome()}
function renderAccess(students,backLabel='Voltar'){document.getElementById('work').innerHTML=`<div class='card'><div class='screen-head'><h2 style='margin:0'>Acessos gerados</h2><button id='backAfterAccess'>${backLabel}</button></div><div class='actions' style='margin-bottom:10px'><button class='success' id='sendAllNow'>Enviar todos</button></div><div class='qrgrid'>${students.map(s=>{const l=s.link||candidateLink(s.access_token);return `<div class='qrbox'><h3>${esc(s.name)}</h3><div id='qr${esc(s.id)}' style='margin:10px 0'></div><div class='actions'><button class='success' data-send-student='${esc(s.id)}'>Enviar prova</button><button data-copy='${esc(l)}'>Copiar link</button></div></div>`}).join('')}</div></div>`;students.forEach(s=>new QRCode(document.getElementById('qr'+s.id),{text:s.link||candidateLink(s.access_token),width:140,height:140}));$('backAfterAccess').onclick=()=>selectedSlot?openSlot(selectedSlot.date+'|'+selectedSlot.time):renderHome();$('sendAllNow').onclick=()=>sendStudents(students);document.querySelectorAll('[data-send-student]').forEach(b=>b.onclick=()=>openWhatsApp(students.find(s=>s.id===b.dataset.sendStudent)));document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyText(b.dataset.copy))}
function renderBatches(){return `<div class='card'><h2 style='margin-top:0'>Provas geradas</h2><div class='tablewrap'><table><thead><tr><th>Data</th><th>Prova</th><th>Tempo</th><th>Ações</th></tr></thead><tbody>${(batches||[]).map(b=>`<tr><td><b>${esc(fmtDateBR(b.training_date))}</b></td><td>${esc(b.title)}</td><td>${esc(b.duration_minutes)} min</td><td><div class='actions'><button data-results='${esc(b.id)}'>Resultados</button><button class='success' data-send-batch='${esc(b.id)}'>Enviar todos</button><button class='danger' data-delete-batch='${esc(b.id)}' data-title='${esc(b.title)}'>Excluir</button></div></td></tr>`).join('')||`<tr><td colspan='4'>Nenhuma prova gerada.</td></tr>`}</tbody></table></div></div>`}
async function showResults(id){const rows=await adminApi('admin_results&batch_id='+encodeURIComponent(id));document.getElementById('work').innerHTML=`<div class='card'><div class='screen-head'><h2 style='margin:0'>Resultados</h2><button id='backResults'>Voltar para provas</button></div><div class='tablewrap'><table><thead><tr><th>Participante</th><th>Loja</th><th>Status</th><th>Acertos</th><th>Nota</th><th>Ações</th></tr></thead><tbody>${rows.map(s=>`<tr><td><b>${esc(s.name)}</b><br><span class='muted'>${esc(s.phone||'')}</span></td><td>${esc(s.store||'-')}</td><td>${esc(ptStatus(s.status))}</td><td>${s.correct_count??'-'}/10</td><td><b>${s.score??'-'}</b></td><td><div class='actions'><button class='success' data-result-send='${esc(s.id)}'>Enviar prova</button><button data-result-copy='${esc(s.link)}'>Copiar link</button></div></td></tr>`).join('')}</tbody></table></div></div>`;$('backResults').onclick=()=>{document.getElementById('work').innerHTML=''};document.querySelectorAll('[data-result-send]').forEach(b=>b.onclick=()=>openWhatsApp(rows.find(s=>s.id===b.dataset.resultSend)));document.querySelectorAll('[data-result-copy]').forEach(b=>b.onclick=()=>copyText(b.dataset.resultCopy))}
async function sendBatch(id){const rows=await adminApi('admin_results&batch_id='+encodeURIComponent(id));sendStudents(rows)}function sendStudents(rows){if(!rows.length)return alert('Nenhum participante para enviar.');if(!confirm(`Abrir WhatsApp para ${rows.length} participante(s)?`))return;rows.forEach((s,i)=>setTimeout(()=>openWhatsApp(s),i*700))}async function deleteBatch(id,title){if(!confirm(`Excluir a prova "${title}"?`))return;await adminApi('admin_delete_batch',{method:'POST',body:JSON.stringify({batch_id:id})});await loadHome()}
if(token)candidate();else admin();
</script>
</body>
</html>
