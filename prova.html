<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Avaliação Técnica de Seminovos</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#ebe7e2;--card:#fff;--ink:#121314;--muted:#6e727a;--line:#d9d4cc;--soft:#f6f3ef;--shadow:0 10px 32px rgba(0,0,0,.06);--radius:26px;--danger:#b33a2d;--success:#256947;--premium:#7c5c14;--black:#0a0a0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{text-decoration:none;color:inherit}button,input,select{font:inherit}.topbar{background:#fff;border-bottom:1px solid #e7e2db;position:sticky;top:0;z-index:20}.topbar-inner{max-width:1200px;margin:auto;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:18px}.brand img{width:178px;height:auto}.brand-title{padding-left:18px;border-left:2px solid #ddd7cf;font-size:18px;font-weight:850;letter-spacing:.08em;color:#666a72;text-transform:uppercase;white-space:nowrap}.wrap{max-width:1180px;margin:auto;padding:24px 22px 34px}.hero{margin-bottom:18px}.hero h1{margin:0 0 6px;font-size:48px;line-height:.96;letter-spacing:-.055em;font-weight:950}.hero p{margin:0;color:var(--muted);font-size:17px}.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-bottom:18px}.btn,button{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:13px;font-weight:850;cursor:pointer}.primary{background:var(--black)!important;color:#fff!important;border-color:var(--black)!important}.danger{background:#fff7f6!important;color:var(--danger)!important;border-color:#ebcdc8!important}.success{background:#f0fbf4!important;color:var(--success)!important;border-color:#cae7d7!important}.muted{color:var(--muted)}.bad{color:var(--danger);font-weight:800}.good{color:var(--success);font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:11px}.field label{font-size:13px;font-weight:850;color:#565960}.field input,.field select,input:not([type=radio]),select{border:1px solid var(--line);border-radius:14px;padding:11px 13px;background:#fff;min-height:44px;width:100%}.notice{padding:14px 16px;border-radius:16px;background:#fff8dd;border:1px solid #eadfa8;color:var(--premium);font-weight:800;margin:14px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.message,.preview{background:var(--soft);border:1px solid #eee8df;border-radius:16px;padding:14px;white-space:pre-wrap;font-size:14px}.timer{position:sticky;top:82px;background:var(--black);color:#fff;padding:12px 16px;border-radius:16px;font-weight:900;text-align:center;z-index:3;margin-bottom:14px}.q{padding:18px 0;border-bottom:1px solid #eee8df}.q-title{display:block;margin-bottom:12px;font-size:16px;line-height:1.35}.choice{display:flex;align-items:center;gap:12px;width:100%;border:1px solid #d8d4ce;border-radius:16px;padding:14px 16px;margin:9px 0;cursor:pointer;background:#fff;line-height:1.35}.choice:hover{border-color:#aaa39a;background:#fbfaf8}.choice input[type=radio]{appearance:none;-webkit-appearance:none;width:22px;height:22px;min-width:22px;min-height:22px;flex:0 0 22px;margin:0;padding:0;border:2px solid #9a9a9a;border-radius:999px;background:#fff}.choice input[type=radio]:checked{border-color:var(--black);background:var(--black);box-shadow:inset 0 0 0 5px #fff}.choice:has(input:checked){border-color:var(--black);background:var(--soft);box-shadow:0 0 0 1px var(--black) inset}.choice-text b{font-weight:950}table{width:100%;border-collapse:collapse;min-width:940px;background:#fff}th{text-align:left;padding:13px 11px;background:#f7f4f0;color:#565960;font-size:12px;text-transform:uppercase;letter-spacing:.05em}td{padding:12px 11px;border-top:1px solid #efebe5;vertical-align:top;font-size:14px}.tablewrap{overflow:auto;border:1px solid #ece7e0;border-radius:20px;max-height:560px}.qrgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.qrbox{border:1px solid #eee8df;border-radius:20px;padding:16px;background:#fff}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.kpi{border:1px solid #eee8df;border-radius:16px;padding:16px;background:var(--soft)}.kpi b{display:block;font-size:28px;margin-top:6px}.feedback{display:none;margin-bottom:14px;border-radius:14px;padding:12px 14px;font-size:14px;font-weight:800}.feedback.show{display:block}.feedback.success{background:#e7f5ee;color:var(--success)}.feedback.error{background:#f8e8e6;color:var(--danger)}.pill{display:inline-flex;padding:6px 9px;border-radius:999px;background:var(--soft);font-size:12px;font-weight:850;color:#565960}@media(max-width:760px){.topbar-inner{flex-direction:column;align-items:flex-start}.wrap{padding:18px 14px 24px}.hero h1{font-size:38px}.grid,.filters,.qrgrid,.kpis{grid-template-columns:1fr}.brand img{width:160px}.brand-title{font-size:14px;padding-left:12px}.timer{top:0}}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-inner"><a class="brand" href="painel-administrador.html"><img src="assets/logo-jorlan.png" alt="Grupo Jorlan"><div class="brand-title">Controle de provas</div></a><a class="btn" href="painel-administrador.html">Painel</a></div></header>
<main class="wrap"><section class="hero"><h1>Avaliação técnica</h1><p>Provas individuais, QR Code, WhatsApp e dashboard de resultados.</p></section><div id="app"></div></main>
<script>
const API_BASE='https://knpcfkexhqpihpfrvpzg.supabase.co/functions/v1/training-exam';
const app=document.getElementById('app');const qs=new URLSearchParams(location.search);const token=qs.get('token');let adminToken=localStorage.getItem('exam_admin_token');let batches=[],presentSlots=[];const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function api(name,opt={}){const r=await fetch(API_BASE+'?api='+name,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||j.message||'Erro');return j}
async function adminApi(name,opt={}){return api(name,{...opt,headers:{...(opt.headers||{}),'x-admin-token':adminToken}})}
function fmtDateBR(date){const [y,m,d]=String(date||'').slice(0,10).split('-');return d&&m&&y?`${d}/${m}/${y}`:String(date||'')}
function todayISO(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function candidateLink(accessToken){return location.origin+location.pathname+'?token='+encodeURIComponent(accessToken)}
function copyText(text){navigator.clipboard.writeText(text).then(()=>alert('Copiado.'))}
function digitsOnly(v){return String(v||'').replace(/\D/g,'')}function brPhone(v){let d=digitsOnly(v);if(!d)return'';if(d.startsWith('55')&&d.length>=12)return d;if(d.length>=10&&d.length<=11)return'55'+d;return d}
function ptStatus(s){return({not_started:'Não iniciada',in_progress:'Em andamento',submitted:'Concluída',expired:'Tempo encerrado'})[s]||s}
function examMsg(name,link){return `Olá, ${name}! Tudo bem?\n\nSegue sua avaliação do treinamento de Seminovos.\n\nA prova possui 10 questões e o tempo começa somente quando você clicar em “Iniciar prova”.\n\nSeu acesso é individual:\n${link}\n\nFaça a prova pelo celular e, após finalizar, sua participação ficará registrada automaticamente.\n\nBoa prova!`}
function openExamWhatsApp(student){const phone=brPhone(student.phone);const link=student.link||candidateLink(student.access_token);const msg=examMsg(student.name,link);if(!phone){alert('Telefone do candidato não localizado. Copie o link manualmente.');return false}window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`,'_blank','noopener');return true}
function showFeedback(type,msg){const box=$('feedback');if(!box){alert(msg);return}box.className='feedback show '+(type==='success'?'success':'error');box.textContent=msg;box.scrollIntoView({behavior:'smooth',block:'nearest'})}
function norm(v){return String(v??'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim()}function clean(v){if(v===null||v===undefined||v instanceof Date)return'';return String(v).replace(/\s+/g,' ').trim()}function invalidName(v){const r=clean(v),n=norm(r);if(!r||r.length<3)return true;if(['data','hora','horario','nome','nome completo','participante','aluno','colaborador','vendedor','consultor','cargo','loja','cidade','praca','email','e mail','telefone','celular','n','no','numero','tema','treinamento','tema treinamento','nota minima'].includes(n))return true;if(/^\d+([\.,]\d+)?$/.test(r))return true;if(/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(r)||/^\d{4}-\d{2}-\d{2}$/.test(r))return true;if(/^[\d\s\-\/\.]+$/.test(r))return true;if(!/[A-Za-zÀ-ÿ]/.test(r))return true;if(r.split(' ').filter(Boolean).length<2)return true;return false}
function extract(rows){const a=['nome','nome completo','participante','aluno','colaborador','vendedor','consultor'];let hr=-1,nc=-1,det='';for(let r=0;r<Math.min(rows.length,12);r++){const row=rows[r]||[];for(let c=0;c<row.length;c++){if(a.includes(norm(row[c]))){hr=r;nc=c;det=clean(row[c]);break}}if(nc>=0)break}if(nc<0)return{names:[],detected:'',rejected:['Nenhuma coluna de nome encontrada.']};const names=[],seen=new Set(),rejected=[];for(let r=hr+1;r<rows.length;r++){const v=clean((rows[r]||[])[nc]);if(!v)continue;if(invalidName(v)){rejected.push(v);continue}const k=norm(v);if(!seen.has(k)){seen.add(k);names.push(v)}}return{names,detected:det||('Coluna '+(nc+1)),rejected:rejected.slice(0,15)}}
async function candidate(){try{const i=await api('candidate_info&token='+encodeURIComponent(token));if(['submitted','expired'].includes(i.status)){app.innerHTML=`<div class='card'><h2>Prova encerrada</h2><p>${esc(i.name)}, sua avaliação já foi registrada.</p><p class='muted'>O resultado será acompanhado pelo responsável pelo treinamento.</p></div>`;return}app.innerHTML=`<div class='card'><h2>${esc(i.training_exam_batches.title)}</h2><p><b>Aluno:</b> ${esc(i.name)}</p><p><b>Tempo:</b> ${esc(i.training_exam_batches.duration_minutes)} minutos • <b>10 questões</b></p><p class='muted'>O cronômetro começa ao clicar em Iniciar.</p><button class='primary' id='start'>Iniciar prova</button></div>`;$('start').onclick=startExam}catch(e){app.innerHTML=`<div class='card bad'>${esc(e.message)}</div>`}}
async function startExam(){try{const d=await api('candidate_start',{method:'POST',body:JSON.stringify({token})});let h=`<div class='timer' id='timer'></div><div class='card'><h2>Prova de ${esc(d.student.name)}</h2><p class='muted'>Marque uma alternativa em cada questão.</p>`;for(const q of d.questions){h+=`<div class='q'><b class='q-title'>${q.position}. ${esc(q.stem)}</b>`;for(const c of q.choices)h+=`<label class='choice'><input type='radio' name='q${q.id}' value='${c.label}' ${q.selected===c.label?'checked':''}><span class='choice-text'><b>${c.label})</b> ${esc(c.text)}</span></label>`;h+='</div>'}h+=`<div style='margin-top:18px'><button class='primary' id='submit'>Finalizar prova</button></div></div>`;app.innerHTML=h;document.querySelectorAll('input[type=radio]').forEach(el=>el.onchange=async e=>{try{await api('candidate_answer',{method:'POST',body:JSON.stringify({token,question_id:Number(e.target.name.slice(1)),selected:e.target.value})})}catch(err){alert(err.message)}});$('submit').onclick=async()=>{if(!confirm('Finalizar a prova?'))return;try{await api('candidate_submit',{method:'POST',body:JSON.stringify({token})});candidate()}catch(e){alert(e.message)}};const exp=new Date(d.student.expires_at).getTime();const tick=()=>{const left=Math.max(0,exp-Date.now()),m=Math.floor(left/60000),s=Math.floor((left%60000)/1000),t=$('timer');if(t)t.textContent='Tempo restante: '+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(left<=0){clearInterval(iv);api('candidate_submit',{method:'POST',body:JSON.stringify({token})}).finally(candidate)}};tick();const iv=setInterval(tick,1000)}catch(e){alert(e.message);candidate()}}
async function admin(){if(!adminToken){app.innerHTML=`<div class='card' style='max-width:480px;margin:auto'><h2>Painel do responsável</h2><div class='field'><label>Usuário</label><input id='user'></div><div class='field'><label>Senha</label><input id='pass' type='password'></div><button class='primary' id='login'>Entrar</button></div>`;$('login').onclick=async()=>{try{const d=await api('login',{method:'POST',body:JSON.stringify({username:$('user').value,password:$('pass').value})});adminToken=d.token;localStorage.setItem('exam_admin_token',adminToken);adminHome()}catch(e){alert(e.message)}};return}adminHome()}
async function adminHome(){try{[batches,presentSlots]=await Promise.all([adminApi('admin_batches'),adminApi('admin_present_slots')]);renderAdmin()}catch(e){localStorage.removeItem('exam_admin_token');adminToken=null;admin()}}
function renderAdmin(){app.innerHTML=`<div id='feedback' class='feedback'></div><div class='card'><div style='display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap'><div><h2>Nova prova</h2><p class='muted'>Use a presença confirmada. A prova será criada somente para quem confirmou ou foi marcado como presente.</p></div><button id='logout'>Sair</button></div><div class='filters'><div class='field'><label>Título-base</label><input id='title' value='Avaliação pós-treinamento — Seminovos'></div><div class='field'><label>Turma com presença</label><select id='presentSlot'>${presentSlots.map(s=>`<option value='${esc(s.slot_date)}|${esc(s.slot_time)}'>${esc(fmtDateBR(s.slot_date))} • ${esc(s.slot_time)} — ${s.confirmed_count} confirmado(s)</option>`).join('')||`<option value=''>Nenhuma turma confirmada</option>`}</select></div><div class='field'><label>Tempo da prova</label><input id='duration' type='number' value='15' min='5' max='60'></div><div class='field'><label>&nbsp;</label><button class='primary' id='createPresent'>Gerar prova da turma</button></div></div><div class='actions'><button id='previewPresent'>Conferir confirmados</button><button id='reload'>Atualizar</button></div></div>${renderPresentSlots()}<div class='card'><details><summary style='font-weight:900;cursor:pointer'>Gerar por planilha, para teste</summary><p class='muted'>Use só para teste ou exceção. A rotina oficial é por presença confirmada.</p><div class='grid'><div class='field'><label>Planilha Excel</label><input id='excel' type='file' accept='.xlsx,.xls,.csv'></div><div class='field'><label>&nbsp;</label><button id='createExcel'>Gerar por planilha</button></div></div></details></div><div id='out'></div>${renderBatches(batches)}`;$('logout').onclick=()=>{localStorage.removeItem('exam_admin_token');adminToken=null;admin()};$('createPresent').onclick=createPresentBatch;$('previewPresent').onclick=previewPresent;$('reload').onclick=adminHome;$('createExcel').onclick=createExcelBatch;document.querySelectorAll('[data-use-slot]').forEach(b=>b.onclick=()=>{$('presentSlot').value=b.dataset.useSlot;window.scrollTo({top:0,behavior:'smooth'})});document.querySelectorAll('[data-create-slot]').forEach(b=>b.onclick=()=>{$('presentSlot').value=b.dataset.createSlot;createPresentBatch()});document.querySelectorAll('[data-results]').forEach(b=>b.onclick=()=>showResults(b.dataset.results));document.querySelectorAll('[data-send-batch]').forEach(b=>b.onclick=()=>sendBatch(b.dataset.sendBatch));document.querySelectorAll('[data-delete-batch]').forEach(b=>b.onclick=()=>deleteBatch(b.dataset.deleteBatch,b.dataset.title||''))}
function renderPresentSlots(){return `<div class='card'><h2>Turmas com presença confirmada</h2><p class='muted'>Relação de turmas realizadas ou do dia, com presença confirmada/presente.</p><div class='tablewrap'><table><thead><tr><th>Data</th><th>Horário</th><th>Confirmados</th><th>Lojas</th><th>Ações</th></tr></thead><tbody>${presentSlots.map(s=>`<tr><td><b>${esc(fmtDateBR(s.slot_date))}</b></td><td>${esc(s.slot_time)}</td><td>${esc(s.confirmed_count)}</td><td>${esc(s.stores||'-')}</td><td><div class='actions'><button data-use-slot='${esc(s.slot_date+'|'+s.slot_time)}'>Usar</button><button class='primary' data-create-slot='${esc(s.slot_date+'|'+s.slot_time)}'>Gerar prova</button></div></td></tr>`).join('')||`<tr><td colspan='5'>Nenhuma turma com presença confirmada ainda.</td></tr>`}</tbody></table></div></div>`}
function renderBatches(list){return `<div class='card'><h2>Provas geradas</h2><div class='tablewrap'><table><thead><tr><th>Data</th><th>Prova</th><th>Tempo</th><th>Ações</th></tr></thead><tbody>${(list||[]).map(b=>`<tr><td><b>${esc(fmtDateBR(b.training_date))}</b></td><td>${esc(b.title)}</td><td>${esc(b.duration_minutes)} min</td><td><div class='actions'><button data-results='${esc(b.id)}'>Resultados</button><button class='success' data-send-batch='${esc(b.id)}'>Enviar todos</button><button class='danger' data-delete-batch='${esc(b.id)}' data-title='${esc(b.title)}'>Excluir</button></div></td></tr>`).join('')||`<tr><td colspan='4'>Nenhuma prova gerada.</td></tr>`}</tbody></table></div></div>`}
function selectedSlot(){const value=$('presentSlot').value||'';const [date,time]=value.split('|');return{date,time}}
async function previewPresent(){try{const s=selectedSlot();if(!s.date)return showFeedback('error','Selecione uma turma.');const rows=await adminApi('admin_present_bookings&training_date='+encodeURIComponent(s.date)+'&slot_time='+encodeURIComponent(s.time));$('out').innerHTML=`<div class='card'><h2>Confirmados da turma</h2><p class='muted'>${fmtDateBR(s.date)} • ${s.time} — ${rows.length} participante(s).</p><div class='preview'>${rows.map(r=>`- ${r.name} • ${r.store||''} • ${r.phone||''}`).join('\n')||'Nenhum participante confirmado.'}</div></div>`}catch(e){showFeedback('error',e.message)}}
async function createPresentBatch(){try{const s=selectedSlot();if(!s.date)return showFeedback('error','Selecione uma turma com presença confirmada.');if(!confirm('Gerar prova somente para participantes confirmados/presentes desta turma?'))return;const d=await adminApi('admin_create_present_batch',{method:'POST',body:JSON.stringify({title:$('title').value,training_date:s.date,slot_time:s.time,duration_minutes:Number($('duration').value)})});showFeedback('success',`Prova criada: ${d.batch.title}. Participantes: ${d.students.length}.`);renderAccess(d.students);setTimeout(()=>adminHome(),1300)}catch(e){showFeedback('error',e.message)}}
async function createExcelBatch(){const f=$('excel').files[0];if(!f)return alert('Selecione o Excel.');const data=await f.arrayBuffer(),wb=XLSX.read(data,{cellDates:true}),ws=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''});const ex=extract(rows);let names=ex.names;if(!names.length)return alert('Nenhum nome válido encontrado.');if(names.length>99){names=names.slice(0,99);alert('Serão usados somente os 99 primeiros nomes.')}if(!confirm('Gerar prova por planilha?'))return;try{const d=await adminApi('admin_create_batch',{method:'POST',body:JSON.stringify({title:$('title').value,training_date:todayISO(),duration_minutes:Number($('duration').value),students:names})});showFeedback('success',`Prova criada para ${d.students.length} participante(s).`);renderAccess(d.students);setTimeout(()=>adminHome(),1300)}catch(e){showFeedback('error',e.message)}}
function renderAccess(students){let h=`<div class='card'><h2>Acessos gerados</h2><div class='actions' style='margin-bottom:12px'><button class='success' id='sendGenerated'>Enviar todos</button></div><div class='qrgrid'>`;for(const s of students){const l=s.link||candidateLink(s.access_token),m=examMsg(s.name,l);h+=`<div class='qrbox'><h3>${esc(s.name)}</h3><div id='qr${esc(s.id)}' style='margin:12px 0'></div><div class='message'>${esc(m)}</div><div class='actions' style='margin-top:10px'><button class='success sendOne' data-id='${esc(s.id)}'>Enviar prova</button><button class='copyLink' data-link='${encodeURIComponent(l)}'>Copiar link</button></div></div>`}h+='</div></div>';$('out').innerHTML=h;for(const s of students)new QRCode($('qr'+s.id),{text:s.link||candidateLink(s.access_token),width:150,height:150});document.querySelectorAll('.sendOne').forEach(b=>b.onclick=()=>openExamWhatsApp(students.find(s=>s.id===b.dataset.id)));document.querySelectorAll('.copyLink').forEach(b=>b.onclick=()=>copyText(decodeURIComponent(b.dataset.link)));$('sendGenerated').onclick=()=>sendRows(students)}
async function showResults(id){try{const rows=await adminApi('admin_results&batch_id='+encodeURIComponent(id));let h=`<div class='card'><div style='display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap'><h2>Resultados</h2><button class='success' id='sendAllResults'>Enviar prova para todos</button></div><div class='tablewrap'><table><thead><tr><th>Aluno</th><th>Telefone</th><th>Status</th><th>Acertos</th><th>Nota</th><th>Ações</th></tr></thead><tbody>`;for(const s of rows){const l=s.link||candidateLink(s.access_token);h+=`<tr><td><b>${esc(s.name)}</b><br><span class='pill'>${esc(s.store||'-')}</span></td><td>${esc(s.phone||'-')}</td><td>${esc(ptStatus(s.status))}</td><td>${s.correct_count??'-'}/10</td><td><b>${s.score??'-'}</b></td><td><div class='actions'><button class='success sendStudent' data-id='${esc(s.id)}'>Enviar prova</button><button class='copyStudent' data-link='${encodeURIComponent(l)}'>Copiar link</button></div></td></tr>`}h+='</tbody></table></div></div>';$('out').innerHTML=h;document.querySelectorAll('.sendStudent').forEach(b=>b.onclick=()=>openExamWhatsApp(rows.find(s=>s.id===b.dataset.id)));document.querySelectorAll('.copyStudent').forEach(b=>b.onclick=()=>copyText(decodeURIComponent(b.dataset.link)));$('sendAllResults').onclick=()=>sendRows(rows)}catch(e){showFeedback('error',e.message)}}
async function sendBatch(id){try{const rows=await adminApi('admin_results&batch_id='+encodeURIComponent(id));sendRows(rows)}catch(e){showFeedback('error',e.message)}}
function sendRows(rows){const valid=(rows||[]).filter(r=>brPhone(r.phone));if(!valid.length)return alert('Nenhum telefone válido encontrado.');if(!confirm(`Abrir WhatsApp para ${valid.length} participante(s)? O navegador pode pedir permissão para abrir abas.`))return;let i=0;const next=()=>{if(i>=valid.length){showFeedback('success','Envios abertos no WhatsApp.');return}openExamWhatsApp(valid[i]);i++;setTimeout(next,900)};next()}
async function deleteBatch(id,title){if(!confirm(`Excluir a prova ${title||''}? Isso apaga a prova, acessos e respostas vinculadas.`))return;try{await adminApi('admin_delete_batch',{method:'POST',body:JSON.stringify({batch_id:id})});showFeedback('success','Prova excluída.');setTimeout(()=>adminHome(),800)}catch(e){showFeedback('error',e.message)}}
if(token)candidate();else admin();
</script>
