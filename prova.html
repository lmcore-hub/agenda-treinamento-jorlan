<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Controle de Provas | Agenda de Treinamento</title>
<style>
:root{--bg:#ebe7e2;--card:#fff;--ink:#121314;--muted:#6e727a;--line:#d9d4cc;--soft:#f6f3ef;--shadow:0 10px 32px rgba(0,0,0,.06);--radius:24px;--danger:#b33a2d;--success:#256947;--premium:#7c5c14;--black:#0a0a0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{text-decoration:none;color:inherit}button,input,select{font:inherit}.topbar{background:#fff;border-bottom:1px solid #e7e2db;position:sticky;top:0;z-index:20}.topbar-inner{max-width:1240px;margin:auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:16px}.brand img{width:168px}.brand-title{padding-left:16px;border-left:2px solid #ddd7cf;font-size:15px;font-weight:900;letter-spacing:.08em;color:#666a72;text-transform:uppercase}.wrap{max-width:1240px;margin:auto;padding:20px}.hero{margin-bottom:14px}.hero h1{margin:0 0 5px;font-size:42px;line-height:.96;letter-spacing:-.055em;font-weight:950}.hero p{margin:0;color:var(--muted);font-size:15px}.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}.btn,button{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 12px;border-radius:13px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:12px;font-weight:900;cursor:pointer;white-space:nowrap}.primary{background:var(--black)!important;color:#fff!important;border-color:var(--black)!important}.danger{background:#fff7f6!important;color:var(--danger)!important;border-color:#ebcdc8!important}.success{background:#f0fbf4!important;color:var(--success)!important;border-color:#cae7d7!important}.muted{color:var(--muted)}.bad{color:var(--danger);font-weight:800}.actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:10px;font-weight:950;color:#565960;text-transform:uppercase;letter-spacing:.05em}.field input,.field select,input:not([type=radio]),select{border:1px solid var(--line);border-radius:13px;padding:8px 10px;background:#fff;min-height:38px;width:100%;font-size:12px}.toolbar,.screen-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.feedback{display:none;margin-bottom:12px;border-radius:14px;padding:11px 13px;font-size:13px;font-weight:850}.feedback.show{display:block}.feedback.success{background:#e7f5ee;color:var(--success)}.feedback.error{background:#f8e8e6;color:var(--danger)}.tablewrap{overflow:auto;border:1px solid #ece7e0;border-radius:18px;background:#fff;max-height:660px}table{width:100%;border-collapse:collapse;min-width:1040px;background:#fff}th{text-align:left;padding:10px 9px;background:#f7f4f0;color:#565960;font-size:10px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}td{padding:10px 9px;border-top:1px solid #efebe5;vertical-align:middle;font-size:12px}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;background:var(--soft);border:1px solid #eee8df;font-size:11px;font-weight:900;color:#565960}.badge.ok{background:#e7f5ee;color:var(--success)}.badge.bad{background:#f8e8e6;color:var(--danger)}.badge.wait{background:#fff8dd;color:var(--premium)}.badge.today{background:#0a0a0b;color:#fff;border-color:#0a0a0b}.notice{padding:11px 13px;border-radius:16px;background:#fff8dd;border:1px solid #eadfa8;color:var(--premium);font-weight:850;margin:10px 0;font-size:13px}.timer{position:sticky;top:78px;background:var(--black);color:#fff;padding:12px 16px;border-radius:16px;font-weight:900;text-align:center;z-index:3;margin-bottom:14px}.progress{height:10px;background:#ece7e0;border-radius:999px;overflow:hidden;margin:10px 0 16px}.progress i{display:block;height:100%;background:#0a0a0b;width:0}.q-title{display:block;margin-bottom:16px;font-size:20px;line-height:1.35}.choice{display:flex;align-items:center;gap:12px;width:100%;border:1px solid #d8d4ce;border-radius:16px;padding:14px 16px;margin:9px 0;cursor:pointer;background:#fff;line-height:1.35}.choice:hover{border-color:#aaa39a;background:#fbfaf8}.choice input[type=radio]{appearance:none;-webkit-appearance:none;width:22px;height:22px;min-width:22px;min-height:22px;flex:0 0 22px;margin:0;padding:0;border:2px solid #9a9a9a;border-radius:999px;background:#fff}.choice input[type=radio]:checked{border-color:var(--black);background:var(--black);box-shadow:inset 0 0 0 5px #fff}.choice:has(input:checked){border-color:var(--black);background:var(--soft);box-shadow:0 0 0 1px var(--black) inset}.choice-text{display:block}.choice-text b{font-weight:950}.exam-card{max-width:860px;margin:0 auto}.big-status{font-size:13px;font-weight:900;color:#565960;margin-bottom:8px}.small{font-size:11px;color:#6e727a;font-weight:750}@media(max-width:760px){.topbar-inner{flex-direction:column;align-items:flex-start}.wrap{padding:16px 12px}.hero h1{font-size:34px}table{min-width:900px}.brand img{width:150px}.brand-title{font-size:13px;padding-left:12px}.timer{top:0}.q-title{font-size:17px}}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-inner"><a class="brand" href="painel-administrador.html"><img src="assets/logo-jorlan.png" alt="Grupo Jorlan"><div class="brand-title">Controle de provas</div></a><a class="btn" href="painel-administrador.html">Painel</a></div></header>
<main class="wrap"><section class="hero"><h1>Avaliação técnica</h1><p>Gere provas por turma, somente para presença confirmada, com envio por WhatsApp.</p></section><div id="app"></div></main>
<script>
const API_BASE='https://knpcfkexhqpihpfrvpzg.supabase.co/functions/v1/training-exam';
const app=document.getElementById('app');
const params=new URLSearchParams(location.search);
const token=params.get('token');
const ADMIN_KEYS=['jorlan_admin_session_token','jorlanTrainingAdminToken'];
let batches=[],examSlots=[],slotBookings=[],currentExam=null,currentQuestionIndex=0,timerInterval=null;
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function adminToken(){for(const k of ADMIN_KEYS){const v=localStorage.getItem(k)||sessionStorage.getItem(k);if(v)return v}return''}
async function api(name,opt={}){const r=await fetch(API_BASE+'?api='+name,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||j.message||'Erro');return j}
async function adminApi(name,opt={}){const t=adminToken();if(!t)throw new Error('Sessão administrativa não encontrada. Faça login no painel novamente.');return api(name,{...opt,headers:{...(opt.headers||{}),'x-admin-token':t}})}
function fmtDateBR(date){const[y,m,d]=String(date||'').slice(0,10).split('-');return d&&m&&y?`${d}/${m}/${y}`:String(date||'')}
function fmtDateTime(v){if(!v)return'Não enviado';const d=new Date(v);return d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
function todayISO(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function candidateLink(t){return location.origin+location.pathname+'?token='+encodeURIComponent(t)}
function digitsOnly(v){return String(v||'').replace(/\D/g,'')}
function brPhone(v){let d=digitsOnly(v);if(!d)return'';if(d.startsWith('55')&&d.length>=12)return d;if(d.length>=10&&d.length<=11)return'55'+d;return d}
function ptStatus(s){return({not_started:'Não iniciada',in_progress:'Em andamento',submitted:'Concluída',expired:'Expirada'})[s]||s}
function presenceStatus(s){return({pending:'Pendente',confirmed:'Confirmou',present:'Presente',absent:'Faltou'})[s]||'Pendente'}
function badgeCls(s){return ['confirmed','present','submitted'].includes(String(s))?'ok':String(s)==='absent'||String(s)==='expired'?'bad':'wait'}
function examMsg(name,link){return `Olá, ${name}! Tudo bem?\n\nSegue sua avaliação do treinamento O Raio-X da Negociação.\n\nA partir deste envio, você tem 25 minutos para iniciar a prova. Após iniciar, o tempo de realização será de 15 minutos.\n\nA prova possui 10 questões e será exibida uma questão por vez. Depois de avançar, não será possível voltar para alterar a resposta.\n\nSeu acesso é individual:\n${link}\n\nBoa prova!`}
function feedback(type,msg){const box=$('feedback');if(!box){alert(msg);return}box.className='feedback show '+(type==='success'?'success':'error');box.textContent=msg;box.scrollIntoView({behavior:'smooth',block:'nearest'})}
async function armLinks(payload){return await adminApi('admin_arm_links',{method:'POST',body:JSON.stringify(payload)})}
function openWhatsApp(s){const phone=brPhone(s.phone);const link=s.link||candidateLink(s.access_token);if(!phone){alert('Telefone não localizado para '+(s.name||'participante')+'.');return false}window.open(`https://wa.me/${phone}?text=${encodeURIComponent(examMsg(s.name,link))}`,'_blank','noopener');return true}
async function sendOne(studentId){try{const r=await armLinks({student_id:studentId});const s=r.students[0];if(!s)throw new Error('Participante não localizado.');openWhatsApp(s);feedback('success','Link liberado. Este participante tem até '+fmtDateTime(r.start_deadline_at)+' para iniciar a prova.');await refreshResults(s.batch_id)}catch(e){feedback('error',e.message)}}
async function sendBatch(batchId){try{const ok=confirm('Liberar os links agora e abrir WhatsApp para todos os participantes ainda não iniciados? O prazo de 25 minutos começa agora.');if(!ok)return;const r=await armLinks({batch_id:batchId});let opened=0;for(const s of r.students){if(['not_started'].includes(String(s.status||'not_started'))&&openWhatsApp(s))opened++}feedback('success','Links liberados. Prazo para iniciar até '+fmtDateTime(r.start_deadline_at)+'. WhatsApps abertos: '+opened+'.');await refreshResults(batchId)}catch(e){feedback('error',e.message)}}
function copyText(t){navigator.clipboard.writeText(t).then(()=>alert('Copiado.'))}
async function candidate(){try{let i=await api('candidate_info&token='+encodeURIComponent(token));if(['submitted','expired'].includes(i.status)){app.innerHTML=`<div class='card exam-card'><h2>Prova encerrada</h2><p>${esc(i.name)}, sua avaliação já foi registrada.</p><p class='muted'>O resultado será acompanhado pelo responsável pelo treinamento.</p></div>`;return}const deadline=i.link_expires_at?`<p><b>Prazo para iniciar:</b> ${esc(fmtDateTime(i.link_expires_at))}</p>`:'';app.innerHTML=`<div class='card exam-card'><h2>${esc(i.training_exam_batches.title)}</h2><p><b>Aluno:</b> ${esc(i.name)}</p><p><b>Tempo:</b> ${esc(i.training_exam_batches.duration_minutes)} minutos • <b>10 questões</b></p>${deadline}<div class='notice'>A prova será exibida uma questão por vez. Após responder e avançar, não será possível voltar para alterar a resposta.</div><button class='primary' id='start'>Iniciar prova</button></div>`;$('start').onclick=startExam}catch(e){app.innerHTML=`<div class='card bad'>${esc(e.message)}</div>`}}
async function startExam(){try{const d=await api('candidate_start',{method:'POST',body:JSON.stringify({token})});currentExam=d;const firstOpen=d.questions.findIndex(q=>!q.selected);currentQuestionIndex=firstOpen>=0?firstOpen:d.questions.length;startTimer(new Date(d.student.expires_at).getTime());renderCurrentQuestion()}catch(e){alert(e.message);candidate()}}
function startTimer(exp){clearInterval(timerInterval);const tick=()=>{const left=Math.max(0,exp-Date.now()),m=Math.floor(left/60000),s=Math.floor((left%60000)/1000),t=$('timer');if(t)t.textContent='Tempo restante: '+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(left<=0){clearInterval(timerInterval);api('candidate_submit',{method:'POST',body:JSON.stringify({token})}).finally(candidate)}};tick();timerInterval=setInterval(tick,1000)}
function renderCurrentQuestion(){const qs=currentExam.questions||[];if(currentQuestionIndex>=qs.length){renderFinishScreen();return}const q=qs[currentQuestionIndex];const answered=qs.filter(x=>x.selected).length;const total=qs.length;let h=`<div class='timer' id='timer'></div><div class='card exam-card'><div class='big-status'>Questão ${currentQuestionIndex+1} de ${total}</div><div class='progress'><i style='width:${Math.round((answered/total)*100)}%'></i></div><b class='q-title'>${esc(q.stem)}</b><form id='answerForm'>`;for(const c of q.choices){h+=`<label class='choice'><input type='radio' name='answer' value='${esc(c.label)}'><span class='choice-text'><b>${esc(c.label)})</b> ${esc(c.text)}</span></label>`}h+=`<div class='actions' style='justify-content:flex-end;margin-top:16px'><button class='primary' type='submit'>Responder e avançar</button></div></form><p class='muted' style='margin-top:12px'>Depois de avançar, esta questão não poderá ser alterada.</p></div>`;app.innerHTML=h;$('answerForm').onsubmit=submitCurrentAnswer}
async function submitCurrentAnswer(ev){ev.preventDefault();const selected=document.querySelector('input[name="answer"]:checked')?.value;if(!selected){alert('Marque uma alternativa.');return}const q=currentExam.questions[currentQuestionIndex];const btn=ev.currentTarget.querySelector('button[type="submit"]');btn.disabled=true;btn.textContent='Salvando...';try{await api('candidate_answer',{method:'POST',body:JSON.stringify({token,question_id:q.id,selected})});q.selected=selected;currentQuestionIndex+=1;renderCurrentQuestion()}catch(e){alert(e.message);btn.disabled=false;btn.textContent='Responder e avançar'}}
function renderFinishScreen(){const total=(currentExam.questions||[]).length;app.innerHTML=`<div class='timer' id='timer'></div><div class='card exam-card'><h2>Questões respondidas</h2><p>Você respondeu as ${total} questões da avaliação.</p><div class='notice'>Ao finalizar, a prova será encerrada e enviada para registro.</div><button class='primary' id='finishExam'>Finalizar prova</button></div>`;$('finishExam').onclick=async()=>{if(!confirm('Finalizar a prova agora?'))return;try{await api('candidate_submit',{method:'POST',body:JSON.stringify({token})});clearInterval(timerInterval);candidate()}catch(e){alert(e.message)}}}
async function admin(){try{await loadHome()}catch(e){app.innerHTML=`<div class='card'><h2>Sessão administrativa</h2><p class='bad'>${esc(e.message)}</p><p class='muted'>Entre novamente pelo painel administrativo principal.</p><a class='btn primary' href='index.html'>Ir para login</a></div>`}}
async function loadHome(){[batches,examSlots]=await Promise.all([adminApi('admin_batches'),adminApi('admin_exam_slots')]);renderHome()}
function renderHome(){app.innerHTML=`<div id='feedback' class='feedback'></div><div class='card'><div class='screen-head'><div><h2 style='margin:0'>Turmas com inscritos</h2><p class='muted' style='margin:4px 0 0'>Gere a prova apenas para confirmados/presentes. O prazo de 25 minutos começa somente no envio pelo WhatsApp.</p></div><button class='btn' onclick='loadHome()'>Atualizar</button></div><div class='tablewrap' style='margin-top:12px'><table><thead><tr><th>Turma</th><th>Curso</th><th>Inscritos</th><th>Confirmados</th><th>Pendentes</th><th>Ações</th></tr></thead><tbody>${examSlots.length?examSlots.map(s=>`<tr><td><b>${fmtDateBR(s.slot_date)} ${s.slot_time}</b> ${s.slot_date===todayISO()?"<span class='badge today'>Hoje</span>":''}<br><span class='small'>${esc(s.stores||'')}</span></td><td>${esc(s.course_name)}</td><td><span class='badge'>${s.total}</span></td><td><span class='badge ok'>${s.confirmed_count}</span></td><td><span class='badge wait'>${s.pending_count||0}</span></td><td><div class='actions'><button onclick='viewSlot("${s.id}")'>Ver inscritos</button><button class='primary' onclick='createBatch("${s.id}",${Number(s.exam_duration_minutes||15)})'>Gerar prova</button></div></td></tr>`).join(''):`<tr><td colspan='6'>Nenhuma turma com inscritos.</td></tr>`}</tbody></table></div></div>${renderBatches()}`}
function renderBatches(){return `<div class='card'><div class='screen-head'><div><h2 style='margin:0'>Provas geradas</h2><p class='muted' style='margin:4px 0 0'>Use “Enviar todos” para liberar os links e iniciar a janela de 25 minutos.</p></div></div><div class='tablewrap' style='margin-top:12px'><table><thead><tr><th>Prova</th><th>Data</th><th>Duração</th><th>Envio WhatsApp</th><th>Ações</th></tr></thead><tbody>${batches.length?batches.map(b=>`<tr><td><b>${esc(b.title)}</b><br><span class='small'>${esc(b.store||'')}</span></td><td>${fmtDateBR(b.training_date)}</td><td>${b.duration_minutes} min</td><td>${fmtDateTime(b.whatsapp_sent_at)}</td><td><div class='actions'><button onclick='refreshResults("${b.id}")'>Resultados</button><button class='success' onclick='sendBatch("${b.id}")'>Enviar todos</button><button class='danger' onclick='deleteBatch("${b.id}")'>Excluir</button></div></td></tr>`).join(''):`<tr><td colspan='5'>Nenhuma prova gerada.</td></tr>`}</tbody></table></div><div id='results'></div></div>`}
async function viewSlot(id){try{slotBookings=await adminApi('admin_slot_bookings&slot_id='+encodeURIComponent(id));const box=document.createElement('div');box.className='card';box.innerHTML=`<div class='screen-head'><h2 style='margin:0'>Inscritos da turma</h2><button onclick='this.closest(".card").remove()'>Fechar</button></div><div class='tablewrap' style='margin-top:12px'><table><thead><tr><th>Nome</th><th>Loja</th><th>Telefone</th><th>Presença</th><th>Ações</th></tr></thead><tbody>${slotBookings.map(b=>`<tr><td><b>${esc(b.name)}</b><br><span class='small'>${esc(b.email||'')}</span></td><td>${esc(b.store||'')}<br><span class='small'>${esc(b.city||'')}</span></td><td>${esc(b.phone||'')}</td><td><span class='badge ${badgeCls(b.attendance_status)}'>${presenceStatus(b.attendance_status)}</span></td><td><div class='actions'><button onclick='markPresence("${b.id}","present")'>Presente</button><button onclick='markPresence("${b.id}","confirmed")'>Confirmou</button><button class='danger' onclick='markPresence("${b.id}","absent")'>Faltou</button></div></td></tr>`).join('')}</tbody></table></div>`;app.prepend(box)}catch(e){feedback('error',e.message)}}
async function markPresence(id,status){try{await adminApi('admin_mark_attendance',{method:'POST',body:JSON.stringify({booking_id:id,attendance_status:status})});feedback('success','Presença atualizada.');await loadHome()}catch(e){feedback('error',e.message)}}
async function createBatch(slotId,duration){try{if(!confirm('Gerar prova somente para confirmados/presentes desta turma?'))return;const r=await adminApi('admin_create_present_batch',{method:'POST',body:JSON.stringify({slot_id:slotId,duration_minutes:duration})});feedback('success','Prova gerada para '+r.students.length+' participante(s). O prazo de 25 minutos começará somente quando você enviar pelo WhatsApp.');await loadHome();await refreshResults(r.batch.id)}catch(e){feedback('error',e.message)}}
async function deleteBatch(id){try{if(!confirm('Excluir esta prova e seus links?'))return;await adminApi('admin_delete_batch',{method:'POST',body:JSON.stringify({batch_id:id})});feedback('success','Prova excluída.');await loadHome()}catch(e){feedback('error',e.message)}}
async function refreshResults(batchId){try{const rows=await adminApi('admin_results&batch_id='+encodeURIComponent(batchId));const target=$('results')||document.createElement('div');target.id='results';target.innerHTML=`<div class='notice'>Regra de prazo: ao clicar em Enviar prova ou Enviar todos, o participante tem 25 minutos para iniciar. Após iniciar, tem 15 minutos para concluir.</div><div class='tablewrap' style='margin-top:12px'><table><thead><tr><th>Participante</th><th>Status</th><th>Envio</th><th>Prazo início</th><th>Nota</th><th>Ações</th></tr></thead><tbody>${rows.map(s=>`<tr><td><b>${esc(s.name)}</b><br><span class='small'>${esc(s.phone||'')}</span></td><td><span class='badge ${badgeCls(s.status)}'>${ptStatus(s.status)}</span></td><td>${fmtDateTime(s.link_sent_at)}</td><td>${fmtDateTime(s.link_expires_at)}</td><td>${s.score??'-'}</td><td><div class='actions'><button class='success' onclick='sendOne("${s.id}")'>Enviar prova</button><button onclick='copyText("${candidateLink(s.access_token)}")'>Copiar link</button></div></td></tr>`).join('')}</tbody></table></div>`;if(!$('results'))document.querySelector('.card:last-child').appendChild(target);target.scrollIntoView({behavior:'smooth',block:'start'})}catch(e){feedback('error',e.message)}}
if(token)candidate();else admin();
</script>
</body>
</html>
