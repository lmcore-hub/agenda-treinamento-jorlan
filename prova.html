<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Controle de Provas | Agenda de Treinamento</title>
<style>
:root{--bg:#ebe7e2;--card:#fff;--ink:#121314;--muted:#6e727a;--line:#d9d4cc;--soft:#f6f3ef;--danger:#b33a2d;--success:#256947;--warn:#7c5c14;--black:#0a0a0b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}a{text-decoration:none;color:inherit}button,input{font:inherit}.topbar{background:#fff;border-bottom:1px solid #e7e2db}.topbar-inner{max-width:1240px;margin:auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:16px}.brand img{width:168px}.brand-title{padding-left:16px;border-left:2px solid #ddd7cf;font-size:15px;font-weight:900;letter-spacing:.08em;color:#666a72;text-transform:uppercase}.wrap{max-width:1240px;margin:auto;padding:20px}.hero h1{margin:0 0 5px;font-size:42px;line-height:.96;letter-spacing:-.055em;font-weight:950}.hero p{margin:0 0 16px;color:var(--muted)}.card{background:#fff;border-radius:24px;box-shadow:0 10px 32px rgba(0,0,0,.06);padding:18px;margin-bottom:14px}.btn,button{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 12px;border-radius:13px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:12px;font-weight:900;cursor:pointer}.primary{background:var(--black)!important;color:#fff!important;border-color:var(--black)!important}.danger{background:#fff7f6!important;color:var(--danger)!important;border-color:#ebcdc8!important}.success{background:#f0fbf4!important;color:var(--success)!important;border-color:#cae7d7!important}.muted{color:var(--muted)}.actions,.toolbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.toolbar{justify-content:space-between}.feedback{display:none;margin-bottom:12px;border-radius:14px;padding:11px 13px;font-size:13px;font-weight:850}.feedback.show{display:block}.feedback.success{background:#e7f5ee;color:var(--success)}.feedback.error{background:#f8e8e6;color:var(--danger)}.tablewrap{overflow:auto;border:1px solid #ece7e0;border-radius:18px;background:#fff}table{width:100%;border-collapse:collapse;min-width:980px}th{text-align:left;padding:10px 9px;background:#f7f4f0;color:#565960;font-size:10px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}td{padding:10px 9px;border-top:1px solid #efebe5;vertical-align:middle;font-size:12px}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;background:var(--soft);font-size:11px;font-weight:900}.badge.ok{background:#e7f5ee;color:var(--success)}.badge.bad{background:#f8e8e6;color:var(--danger)}.badge.wait{background:#fff8dd;color:var(--warn)}.badge.today{background:#0a0a0b;color:#fff}.notice{padding:11px 13px;border-radius:16px;background:#fff8dd;border:1px solid #eadfa8;color:var(--warn);font-weight:850;margin:10px 0;font-size:13px}.timer{position:sticky;top:10px;background:#0a0a0b;color:#fff;padding:12px 16px;border-radius:16px;font-weight:900;text-align:center;z-index:3;margin-bottom:14px}.timer.over{background:#7c5c14}.progress{height:10px;background:#ece7e0;border-radius:999px;overflow:hidden;margin:10px 0 16px}.progress i{display:block;height:100%;background:#0a0a0b}.q-title{display:block;margin-bottom:16px;font-size:20px;line-height:1.35}.choice{display:flex;align-items:center;gap:12px;width:100%;border:1px solid #d8d4ce;border-radius:16px;padding:14px 16px;margin:9px 0;cursor:pointer;background:#fff}.choice input{appearance:none;-webkit-appearance:none;width:22px;height:22px;flex:0 0 22px;margin:0;border:2px solid #9a9a9a;border-radius:999px}.choice input:checked{border-color:#0a0a0b;background:#0a0a0b;box-shadow:inset 0 0 0 5px #fff}.choice:has(input:checked){border-color:#0a0a0b;background:#f6f3ef}.exam-card{max-width:860px;margin:0 auto}.queue{display:grid;gap:8px;margin-top:12px}.queue-item{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid #eee8df;border-radius:14px;padding:10px;background:#fcfbfa}.queue-counter{font-size:12px;color:#6e727a;font-weight:900;text-transform:uppercase;letter-spacing:.05em}.queue-preview{white-space:pre-wrap;background:#f6f3ef;border:1px solid #eee8df;border-radius:16px;padding:12px;font-size:12px;color:#565960;margin-top:10px;max-height:220px;overflow:auto}.small{font-size:11px;color:#6e727a}.screen-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.bad{color:var(--danger);font-weight:800}@media(max-width:760px){.topbar-inner{flex-direction:column;align-items:flex-start}.wrap{padding:16px 12px}.hero h1{font-size:34px}table{min-width:820px}.brand img{width:150px}.queue-item{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-inner"><a class="brand" href="painel-administrador.html"><img src="assets/logo-jorlan.png" alt="Grupo Jorlan"><div class="brand-title">Controle de provas</div></a><a class="btn" href="painel-administrador.html">Painel</a></div></header>
<main class="wrap"><section class="hero"><h1>Avaliação técnica</h1><p>Uma prova oficial por turma. Todos os inscritos entram na prova; o envio em massa é feito para confirmados/presentes e a realização da prova define a presença.</p></section><div id="app"></div></main>
<script>
const API_BASE='https://knpcfkexhqpihpfrvpzg.supabase.co/functions/v1/training-exam';
const app=document.getElementById('app');
const params=new URLSearchParams(location.search);
const token=params.get('token');
const ADMIN_KEYS=['jorlan_admin_session_token','jorlanTrainingAdminToken'];
let batches=[],examSlots=[],slotBookings=[],currentExam=null,currentQuestionIndex=0,timerInterval=null;
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function adminToken(){for(const k of ADMIN_KEYS){const v=localStorage.getItem(k)||sessionStorage.getItem(k);if(v)return v}return''}
async function api(name,opt={}){const r=await fetch(API_BASE+'?api='+name,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||j.message||'Erro');return j}
async function adminApi(name,opt={}){const t=adminToken();if(!t)throw new Error('Sessão administrativa não encontrada. Faça login novamente.');return api(name,{...opt,headers:{...(opt.headers||{}),'x-admin-token':t}})}
function fmtDateBR(date){const[y,m,d]=String(date||'').slice(0,10).split('-');return d&&m&&y?`${d}/${m}/${y}`:String(date||'')}
function fmtDateTime(v){if(!v)return'Não enviado';return new Date(v).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function todayISO(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function digitsOnly(v){return String(v||'').replace(/\D/g,'')}
function brPhone(v){let d=digitsOnly(v);if(!d)return'';if(d.startsWith('55')&&d.length>=12)return d;if(d.length>=10&&d.length<=11)return'55'+d;return d}
function ptStatus(s){return({not_started:'Não iniciada',in_progress:'Em andamento',submitted:'Concluída',expired:'Faltou'})[s]||s}
function badgeCls(s){return s==='submitted'||s==='present'?'ok':s==='expired'||s==='absent'?'bad':'wait'}
function examMsg(name,link){return `Olá, ${name}! Tudo bem?\n\nSegue sua avaliação do treinamento O Raio-X da Negociação.\n\nA partir deste envio, você tem 15 minutos para iniciar a prova. Após iniciar, o tempo de referência é de 15 minutos. Se ultrapassar esse tempo, a prova não será zerada; o sistema apenas registrará o tempo excedido.\n\nA prova possui 10 questões e será exibida uma questão por vez. Depois de avançar, não será possível voltar para alterar a resposta.\n\nSeu acesso é individual:\n${link}\n\nBoa prova!`}
function feedback(type,msg){const box=$('feedback');if(!box){alert(msg);return}box.className='feedback show '+(type==='success'?'success':'error');box.textContent=msg}
async function armLinks(payload){return adminApi('admin_arm_links',{method:'POST',body:JSON.stringify(payload)})}
function whatsappUrl(s){const phone=brPhone(s.phone);if(!phone)return'';return `https://wa.me/${phone}?text=${encodeURIComponent(examMsg(s.name,s.link))}`}
function excelText(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function safeFileName(v){return String(v||'resultados').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9_-]+/g,'_').replace(/^_+|_+$/g,'').slice(0,100)||'resultados'}
function exportResultsXls(rows,batch){
  const present=rows.filter(s=>s.attendance_status==='present').length;
  const absent=rows.filter(s=>s.attendance_status!=='present').length;
  const scores=rows.filter(s=>s.attendance_status==='present'&&s.score!=null).map(s=>Number(s.score));
  const avg=scores.length?(scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(2):'-';
  const head=['Participante','Cargo','Loja','Cidade','Telefone','E-mail','Status da prova','Presença','Respostas','Nota','Início','Finalização','Tempo excedido','Link individual'];
  const data=rows.map(s=>[
    s.name||'',s.role||'',s.store||'',s.city||'',s.phone||'',s.email||'',ptStatus(s.status),s.attendance_status==='present'?'Presente':'Faltou',
    `${Number(s.responses_count||0)}/10`,s.score==null?'':Number(s.score).toFixed(1),fmtDateTime(s.started_at),fmtDateTime(s.submitted_at),Number(s.overtime_minutes||0)>0?`+${s.overtime_minutes} min`:'',s.link||''
  ]);
  const summary=[['Prova',batch?.title||''],['Data',fmtDateBR(batch?.training_date||'')],['Participantes',rows.length],['Presentes',present],['Faltas',absent],['Média das notas',avg]];
  const summaryHtml=summary.map(r=>`<tr><th>${excelText(r[0])}</th><td>${excelText(r[1])}</td></tr>`).join('');
  const tableHtml=`<tr>${head.map(h=>`<th>${excelText(h)}</th>`).join('')}</tr>`+data.map(r=>`<tr>${r.map(v=>`<td>${excelText(v)}</td>`).join('')}</tr>`).join('');
  const html=`<!doctype html><html><head><meta charset="utf-8"><style>body{font-family:Arial,sans-serif}table{border-collapse:collapse;margin-bottom:18px}th,td{border:1px solid #bbb;padding:6px}th{background:#eee;font-weight:bold}</style></head><body><h2>${excelText(batch?.title||'Resultados')}</h2><table>${summaryHtml}</table><table>${tableHtml}</table></body></html>`;
  const blob=new Blob(['\ufeff'+html],{type:'application/vnd.ms-excel;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=safeFileName((batch?.title||'resultados')+'_resultados')+'.xls';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1200);
}
async function candidate(){try{const i=await api('candidate_info&token='+encodeURIComponent(token));if(i.status==='submitted'){app.innerHTML=`<div class='card exam-card'><h2>Prova concluída</h2><p>${esc(i.name)}, sua avaliação foi registrada.</p></div>`;return}if(i.status==='expired'){app.innerHTML=`<div class='card exam-card'><h2>Prazo encerrado</h2><p>${esc(i.name)}, o prazo para iniciar esta avaliação foi encerrado.</p></div>`;return}const deadline=i.link_expires_at?`<p><b>Prazo para iniciar:</b> ${esc(fmtDateTime(i.link_expires_at))}</p>`:'';const label=i.status==='in_progress'?'Continuar prova':'Iniciar prova';app.innerHTML=`<div class='card exam-card'><h2>${esc(i.training_exam_batches.title)}</h2><p><b>Aluno:</b> ${esc(i.name)}</p><p><b>Referência de tempo:</b> ${esc(i.training_exam_batches.duration_minutes)} minutos • <b>10 questões</b></p>${deadline}<div class='notice'>Uma questão por vez. Depois de responder e avançar, não é possível voltar. Ultrapassar o tempo de referência não zera a prova.</div><button class='primary' id='start'>${label}</button></div>`;$('start').onclick=startExam}catch(e){app.innerHTML=`<div class='card bad'>${esc(e.message)}</div>`}}
async function startExam(){try{const d=await api('candidate_start',{method:'POST',body:JSON.stringify({token})});currentExam=d;const idx=d.questions.findIndex(q=>!q.selected);currentQuestionIndex=idx>=0?idx:d.questions.length;startTimer(new Date(d.student.expires_at).getTime());renderCurrentQuestion()}catch(e){alert(e.message);candidate()}}
function startTimer(exp){clearInterval(timerInterval);const tick=()=>{const diff=exp-Date.now(),t=$('timer');if(!t)return;if(diff>=0){const m=Math.floor(diff/60000),s=Math.floor((diff%60000)/1000);t.classList.remove('over');t.textContent='Tempo de referência restante: '+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}else{const over=Math.abs(diff),m=Math.floor(over/60000),s=Math.floor((over%60000)/1000);t.classList.add('over');t.textContent='Tempo de referência excedido: +'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+' — continue e finalize'}};tick();timerInterval=setInterval(tick,1000)}
function renderCurrentQuestion(){const qs=currentExam.questions||[];if(currentQuestionIndex>=qs.length){renderFinishScreen();return}const q=qs[currentQuestionIndex],answered=qs.filter(x=>x.selected).length,total=qs.length;let h=`<div class='timer' id='timer'></div><div class='card exam-card'><div class='small'><b>Questão ${currentQuestionIndex+1} de ${total}</b></div><div class='progress'><i style='width:${Math.round((answered/total)*100)}%'></i></div><b class='q-title'>${esc(q.stem)}</b><form id='answerForm'>`;for(const c of q.choices)h+=`<label class='choice'><input type='radio' name='answer' value='${esc(c.label)}'><span><b>${esc(c.label)})</b> ${esc(c.text)}</span></label>`;h+=`<div class='actions' style='justify-content:flex-end;margin-top:16px'><button class='primary' type='submit'>Responder e avançar</button></div></form><p class='muted'>Depois de avançar, esta questão não poderá ser alterada.</p></div>`;app.innerHTML=h;$('answerForm').onsubmit=submitCurrentAnswer}
async function submitCurrentAnswer(ev){ev.preventDefault();const selected=document.querySelector('input[name="answer"]:checked')?.value;if(!selected)return alert('Marque uma alternativa.');const q=currentExam.questions[currentQuestionIndex],btn=ev.currentTarget.querySelector('button[type="submit"]');btn.disabled=true;btn.textContent='Salvando...';try{await api('candidate_answer',{method:'POST',body:JSON.stringify({token,question_id:q.id,selected})});q.selected=selected;currentQuestionIndex++;renderCurrentQuestion()}catch(e){alert(e.message);btn.disabled=false;btn.textContent='Responder e avançar'}}
function renderFinishScreen(){app.innerHTML=`<div class='timer' id='timer'></div><div class='card exam-card'><h2>Questões respondidas</h2><p>Você respondeu as 10 questões.</p><button class='primary' id='finishExam'>Finalizar prova</button></div>`;$('finishExam').onclick=async()=>{if(!confirm('Finalizar a prova agora?'))return;try{await api('candidate_submit',{method:'POST',body:JSON.stringify({token})});clearInterval(timerInterval);candidate()}catch(e){alert(e.message)}}}
async function loadHome(){[batches,examSlots]=await Promise.all([adminApi('admin_batches'),adminApi('admin_exam_slots')]);renderHome()}
function renderHome(){app.innerHTML=`<div id='feedback' class='feedback'></div><section class='card'><div class='toolbar'><div><h2 style='margin:0'>Turmas com inscritos</h2><p class='muted' style='margin:4px 0 0'>Gerar/atualizar inclui todos os inscritos ativos. A mesma turma nunca cria uma segunda prova.</p></div><button id='refresh' class='btn'>Atualizar</button></div><div class='tablewrap'><table><thead><tr><th>Turma</th><th>Curso</th><th>Inscritos</th><th>Confirmados</th><th>Pendentes</th><th>Faltas</th><th>Ações</th></tr></thead><tbody>${examSlots.map(s=>`<tr><td><b>${fmtDateBR(s.slot_date)} ${esc(s.slot_time)}</b>${s.slot_date===todayISO()?` <span class='badge today'>Hoje</span>`:''}<br><span class='small'>${esc(s.stores||'')}</span></td><td>${esc(s.course_name)}</td><td>${s.total}</td><td><span class='badge ok'>${s.confirmed_count}</span></td><td><span class='badge wait'>${s.pending_count}</span></td><td><span class='badge bad'>${s.absent_count||0}</span></td><td><div class='actions'><button data-slot-view='${s.id}'>Ver inscritos</button><button class='primary' data-slot-generate='${s.id}'>Gerar / atualizar prova</button></div></td></tr>`).join('')||`<tr><td colspan='7'>Nenhuma turma.</td></tr>`}</tbody></table></div></section><section class='card'><div class='screen-head'><div><h2 style='margin:0'>Provas geradas</h2><p class='muted' style='margin:4px 0 0'>“Enviar confirmados” apenas prepara a fila. O prazo de 15 minutos começa individualmente quando você abrir o WhatsApp de cada participante.</p></div></div><div class='tablewrap'><table><thead><tr><th>Prova</th><th>Data</th><th>Duração</th><th>Envio</th><th>Ações</th></tr></thead><tbody>${batches.map(b=>`<tr><td><b>${esc(b.title)}</b><br><span class='small'>${b.slot_id?'Prova oficial da turma':'Histórico'}</span></td><td>${fmtDateBR(b.training_date)}</td><td>${b.duration_minutes} min</td><td>${fmtDateTime(b.whatsapp_sent_at)}</td><td><div class='actions'><button data-results='${b.id}'>Resultados</button><button class='success' data-send-batch='${b.id}'>Enviar confirmados</button><button class='danger' data-delete='${b.id}'>Excluir</button></div></td></tr>`).join('')||`<tr><td colspan='5'>Nenhuma prova gerada.</td></tr>`}</tbody></table></div></section>`;bindHome()}
function bindHome(){$('refresh').onclick=loadHome;document.querySelectorAll('[data-slot-view]').forEach(b=>b.onclick=()=>viewSlot(b.dataset.slotView));document.querySelectorAll('[data-slot-generate]').forEach(b=>b.onclick=()=>generateOrUpdate(b.dataset.slotGenerate,b));document.querySelectorAll('[data-results]').forEach(b=>b.onclick=()=>viewResults(b.dataset.results));document.querySelectorAll('[data-send-batch]').forEach(b=>b.onclick=()=>prepareBatchQueue(b.dataset.sendBatch));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteBatch(b.dataset.delete))}
async function viewSlot(slotId){try{slotBookings=await adminApi('admin_slot_bookings&slot_id='+encodeURIComponent(slotId));const slot=examSlots.find(s=>s.id===slotId);app.innerHTML=`<div class='card'><div class='screen-head'><div><h2 style='margin:0'>Inscritos — ${fmtDateBR(slot.slot_date)} ${esc(slot.slot_time)}</h2><p class='muted'>Todos entram na prova. A realização da avaliação define presença.</p></div><button id='back'>Voltar</button></div><div class='tablewrap'><table><thead><tr><th>Participante</th><th>Loja</th><th>Status atual</th></tr></thead><tbody>${slotBookings.map(b=>`<tr><td><b>${esc(b.name)}</b><br><span class='small'>${esc(b.email||'')} • ${esc(b.phone||'')}</span></td><td>${esc(b.store||'')}</td><td><span class='badge ${badgeCls(b.attendance_status)}'>${esc(b.attendance_status||'pending')}</span></td></tr>`).join('')}</tbody></table></div></div>`;$('back').onclick=renderHome}catch(e){alert(e.message)}}
async function generateOrUpdate(slotId,btn){if(btn?.disabled)return;const original=btn?.textContent||'Gerar / atualizar prova';if(btn){btn.disabled=true;btn.textContent='Atualizando...'}try{let r;try{r=await adminApi('admin_create_present_batch',{method:'POST',body:JSON.stringify({slot_id:slotId})})}catch(e){const msg=String(e?.message||'');if(/23505|duplicate key|training_exam_students_batch_id_name_key/i.test(msg)){await new Promise(resolve=>setTimeout(resolve,350));r=await adminApi('admin_create_present_batch',{method:'POST',body:JSON.stringify({slot_id:slotId})})}else throw e}alert(r.message||'Prova atualizada.');await loadHome()}catch(e){alert(e.message)}finally{if(btn&&document.body.contains(btn)){btn.disabled=false;btn.textContent=original}}}
async function viewResults(batchId){try{const rows=await adminApi('admin_results&batch_id='+encodeURIComponent(batchId));const batch=batches.find(b=>b.id===batchId);app.innerHTML=`<div id='feedback' class='feedback'></div><div class='card'><div class='screen-head'><div><h2 style='margin:0'>Resultados</h2><p class='muted'>${esc(batch?.title||'')}</p></div><div class='actions'><button id='back'>Voltar</button><button id='exportXls'>Baixar Excel (.xls)</button><button class='success' id='queue'>Preparar envio aos confirmados</button></div></div><div class='tablewrap'><table><thead><tr><th>Participante</th><th>Prova</th><th>Presença</th><th>Respostas</th><th>Nota</th><th>Tempo excedido</th><th>Ação</th></tr></thead><tbody>${rows.map(s=>`<tr><td><b>${esc(s.name)}</b><br><span class='small'>${esc(s.store||'')}</span></td><td><span class='badge ${badgeCls(s.status)}'>${ptStatus(s.status)}</span></td><td><span class='badge ${badgeCls(s.attendance_status)}'>${s.attendance_status==='present'?'Presente':'Faltou'}</span></td><td>${Number(s.responses_count||0)}/10</td><td>${s.score==null?'-':Number(s.score).toFixed(1)}</td><td>${Number(s.overtime_minutes||0)>0?`+${s.overtime_minutes} min`:'-'}</td><td><div class='actions'><button data-copy='${esc(s.link)}'>Copiar link</button><button class='success' data-send-one='${s.id}'>WhatsApp</button></div></td></tr>`).join('')}</tbody></table></div></div>`;$('back').onclick=renderHome;$('exportXls').onclick=()=>exportResultsXls(rows,batch);$('queue').onclick=()=>prepareBatchQueue(batchId);document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>navigator.clipboard.writeText(b.dataset.copy).then(()=>alert('Link copiado.')));document.querySelectorAll('[data-send-one]').forEach(b=>b.onclick=()=>sendOne(b.dataset.sendOne))}catch(e){alert(e.message)}}
function openWhatsAppDirect(s){const u=whatsappUrl(s);if(!u){alert('Telefone não localizado para '+(s?.name||'participante')+'.');return false}const w=window.open(u,'_blank');if(!w){window.location.href=u}return true}
async function sendOne(studentId){const popup=window.open('about:blank','_blank');try{const r=await armLinks({student_id:studentId}),s=r.students[0];if(!s)throw new Error('Participante não localizado.');const u=whatsappUrl(s);if(!u)throw new Error('Telefone não localizado.');if(popup&&!popup.closed){popup.location.replace(u)}else{window.location.href=u}return r}catch(e){if(popup&&!popup.closed)popup.close();alert(e.message);return null}}
async function prepareBatchQueue(batchId){try{const batch=batches.find(b=>b.id===batchId);if(!batch?.slot_id)throw new Error('Esta prova não está vinculada a uma turma oficial.');const [rows,bookings]=await Promise.all([adminApi('admin_results&batch_id='+encodeURIComponent(batchId)),adminApi('admin_slot_bookings&slot_id='+encodeURIComponent(batch.slot_id))]);const eligibleBookingIds=new Set(bookings.filter(b=>['confirmed','present'].includes(String(b.attendance_status||''))).map(b=>b.id));const eligible=rows.filter(s=>s.status==='not_started'&&s.booking_id&&eligibleBookingIds.has(s.booking_id));renderQueue(eligible,batchId)}catch(e){alert(e.message)}}
function renderQueue(rows,batchId){
  rows=(rows||[]).filter(s=>s&&s.id&&brPhone(s.phone));
  if(!rows.length){app.innerHTML=`<div class='card'><div class='screen-head'><div><h2 style='margin:0'>Fila de WhatsApp</h2><p class='muted'>Nenhum confirmado pendente de envio.</p></div><button id='back'>Voltar aos resultados</button></div></div>`;$('back').onclick=()=>viewResults(batchId);return}
  let idx=0,sent=0;
  function draw(){
    if(idx>=rows.length){app.innerHTML=`<div class='card'><div class='screen-head'><div><h2 style='margin:0'>Fila de WhatsApp concluída</h2><p class='muted'>WhatsApps abertos: ${sent} de ${rows.length}. Cada prova teve seu prazo iniciado somente no respectivo clique de WhatsApp.</p></div><button id='back'>Voltar aos resultados</button></div></div>`;$('back').onclick=()=>viewResults(batchId);return}
    const s=rows[idx];
    const msg=examMsg(s.name,s.link);
    app.innerHTML=`<div class='card'><div class='screen-head'><div><h2 style='margin:0'>Fila de WhatsApp — prova</h2><p class='queue-counter'>${idx+1} de ${rows.length} • ${sent} aberto(s)</p></div><button id='back'>Voltar aos resultados</button></div><div class='notice'>O prazo de 15 minutos deste participante só começa quando você clicar em <b>Abrir WhatsApp deste</b>.</div><div class='queue-item'><div><b>${esc(s.name)}</b><br><span class='small'>${esc(s.phone||'')}</span></div></div><div class='actions' style='margin-top:12px'><button class='primary' id='openCurrentWhats' type='button'>Abrir WhatsApp deste</button><button id='skipCurrentWhats' type='button'>Pular</button></div><div class='queue-preview'>${esc(msg)}</div></div>`;
    $('back').onclick=()=>viewResults(batchId);
    $('openCurrentWhats').onclick=async()=>{const btn=$('openCurrentWhats');if(btn.disabled)return;btn.disabled=true;btn.textContent='Liberando prova e abrindo...';const r=await sendOne(s.id);if(!r){btn.disabled=false;btn.textContent='Abrir WhatsApp deste';return}sent++;idx++;draw()};
    $('skipCurrentWhats').onclick=()=>{idx++;draw()};
  }
  draw();
}
async function deleteBatch(batchId){if(!confirm('Excluir esta prova?'))return;try{await adminApi('admin_delete_batch',{method:'POST',body:JSON.stringify({batch_id:batchId})});await loadHome()}catch(e){alert(e.message)}}
async function admin(){try{await loadHome()}catch(e){app.innerHTML=`<div class='card bad'>${esc(e.message)}</div>`}}
if(token)candidate();else admin();
</script>
